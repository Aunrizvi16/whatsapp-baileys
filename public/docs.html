<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp API guide</title>
<style>
  :root { color-scheme:dark; --bg:#08090a; --panel:#0f1012; --panel-2:#15161a; --line:#22242a; --line-2:#2c2f36; --text:#f4f5f6; --text-2:#c4c7cd; --muted:#868b95; --accent:#fff; --on-accent:#08090a;
    --get:#4cb782; --post:#6ea8ff; --patch:#f2b84c; --delete:#f2706b; --ok:#4cb782; --warn:#f2b84c; --bad:#f2706b; --tip:#6ea8ff;
    --k:#8fb4ff; --s:#a5d6a7; --n:#f2b84c; --c:#6c717b; --kw:#d9a0ff; }
  @media (prefers-color-scheme: light) { :root { color-scheme:light; --bg:#fff; --panel:#f7f7f8; --panel-2:#f0f1f3; --line:#e4e5e9; --line-2:#d5d7dd; --text:#111214; --text-2:#3a3d43; --muted:#6a6e78; --accent:#111214; --on-accent:#fff;
    --get:#16794d; --post:#2457d6; --patch:#9a6200; --delete:#c2332d; --ok:#16794d; --warn:#9a6200; --bad:#c2332d; --tip:#2457d6; --k:#2457d6; --s:#1a7f37; --n:#9a6200; --c:#8a8f98; --kw:#8250df; } }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:84px; }
  body { margin:0; background:var(--bg); color:var(--text); font:15.5px/1.7 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--tip); }
  code { font:12.8px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; background:var(--panel-2); border:1px solid var(--line); padding:1px 6px; border-radius:5px; overflow-wrap:anywhere; }
  button { font:inherit; cursor:pointer; }

  /* top bar: where your server and key are filled in once, and used in every example */
  header { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .bar { max-width:1240px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:650; letter-spacing:-.01em; margin-right:auto; }
  .brand i { width:24px; height:24px; border-radius:7px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font:700 12px inherit; font-style:normal; }
  .field { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .field input { width:230px; max-width:42vw; background:var(--panel); color:var(--text); border:1px solid var(--line-2); border-radius:8px; padding:6px 10px; font:12.5px ui-monospace, 'SF Mono', Menlo, monospace; }
  .field input:focus { outline:2px solid color-mix(in srgb, var(--tip) 55%, transparent); border-color:transparent; }
  .back { color:var(--muted); font-size:13px; text-decoration:none; } .back:hover { color:var(--text); }

  .wrap { max-width:1240px; margin:0 auto; display:grid; grid-template-columns:230px minmax(0, 1fr); gap:0 44px; padding:0 24px; }
  nav { position:sticky; top:62px; align-self:start; max-height:calc(100vh - 62px); overflow:auto; padding:26px 0 40px; }
  nav h6 { margin:18px 0 4px 10px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; } nav h6:first-child { margin-top:0; }
  nav a { display:block; padding:5px 10px; border-radius:7px; color:var(--text-2); text-decoration:none; font-size:14px; }
  nav a:hover { background:var(--panel-2); color:var(--text); } nav a.on { background:var(--panel-2); color:var(--text); font-weight:600; }
  main { padding:34px 0 140px; min-width:0; max-width:800px; }

  h1 { font-size:36px; line-height:1.15; letter-spacing:-.025em; margin:0 0 12px; }
  .lead { font-size:18px; color:var(--text-2); margin:0 0 26px; max-width:620px; }
  section { padding-top:40px; margin-top:8px; }
  h2 { font-size:25px; letter-spacing:-.015em; line-height:1.25; margin:0 0 8px; }
  h3 { font-size:17px; margin:30px 0 6px; letter-spacing:-.005em; }
  p { margin:8px 0 12px; color:var(--text-2); } strong { color:var(--text); }
  .sub { color:var(--muted); margin:0 0 18px; }

  /* steps */
  .steps { display:grid; gap:12px; margin:22px 0; counter-reset:s; }
  .step { display:grid; grid-template-columns:34px 1fr; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .step > b { width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:14px; }
  .step h3 { margin:2px 0 4px; font-size:16.5px; } .step p { margin:4px 0 8px; } .step > div { min-width:0; }

  /* code */
  .tabs { display:flex; gap:2px; margin:12px 0 0; }
  .tabs button { background:none; border:0; color:var(--muted); padding:6px 12px; border-radius:8px 8px 0 0; font-size:13px; font-weight:500; border-bottom:2px solid transparent; }
  .tabs button:hover { color:var(--text); } .tabs button.on { color:var(--text); border-bottom-color:var(--accent); }
  .code { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:0 12px 12px 12px; margin:0 0 14px; }
  .code.solo { border-radius:12px; margin-top:12px; }
  .code pre { margin:0; padding:15px 18px; overflow:auto; font:12.8px/1.65 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color:var(--text); tab-size:2; }
  .code .cp { position:absolute; right:9px; top:9px; background:var(--panel-2); color:var(--text-2); border:1px solid var(--line-2); border-radius:7px; font-size:12px; padding:3px 10px; opacity:.0; transition:opacity .12s; }
  .code:hover .cp, .cp:focus { opacity:1; } .cp.done { color:var(--ok); opacity:1; }
  .t-k { color:var(--k); } .t-s { color:var(--s); } .t-n { color:var(--n); } .t-c { color:var(--c); font-style:italic; } .t-kw { color:var(--kw); }
  .hint { color:var(--muted); font-size:13px; margin:-4px 0 12px; }

  /* cards, callouts, badges */
  .callout { display:flex; gap:12px; border:1px solid var(--line); border-left:3px solid var(--tip); background:var(--panel); border-radius:10px; padding:12px 16px; margin:16px 0; color:var(--text-2); }
  .callout.warn { border-left-color:var(--warn); } .callout.ok { border-left-color:var(--ok); }
  .callout > div { min-width:0; } .callout p { margin:0; } .callout p + p { margin-top:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:12px; margin:16px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h4 { margin:0 0 4px; font-size:14.5px; } .card p { margin:0; font-size:14px; }
  .badge { display:inline-block; font:600 11px/1 ui-monospace, 'SF Mono', Menlo, monospace; padding:4px 7px; border-radius:5px; letter-spacing:.03em; min-width:52px; text-align:center; border:1px solid currentColor; }
  .GET { color:var(--get); } .POST { color:var(--post); } .PATCH { color:var(--patch); } .DELETE { color:var(--delete); }
  .scope { font-size:12px; color:var(--muted); border:1px solid var(--line-2); border-radius:99px; padding:1px 9px; white-space:nowrap; }

  /* type picker */
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .chip { background:var(--panel); border:1px solid var(--line-2); color:var(--text-2); border-radius:99px; padding:6px 14px; font-size:14px; }
  .chip:hover { color:var(--text); border-color:var(--muted); } .chip.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .panel > p:first-child { margin-top:0; color:var(--text); font-size:16px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl { border:1px solid var(--line); border-radius:12px; overflow:auto; margin:12px 0; background:var(--panel); }
  th, td { text-align:left; vertical-align:top; padding:9px 14px; border-bottom:1px solid var(--line); color:var(--text-2); }
  th { font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; } tr:last-child td { border-bottom:0; }
  td:first-child { white-space:nowrap; color:var(--text); }
  .req { color:var(--bad); font-size:12px; margin-left:6px; } .opt { color:var(--muted); font-size:12px; margin-left:6px; }

  /* events, endpoints, faq */
  details { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:8px 0; }
  details > summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; align-items:center; gap:12px; color:var(--text); }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:''; margin-left:auto; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); transition:transform .15s; flex-shrink:0; }
  details[open] > summary::after { transform:rotate(-135deg); }
  details > .body { padding:0 18px 14px; border-top:1px solid var(--line); } details > .body > :first-child { margin-top:14px; }
  summary .path { font:13.5px ui-monospace, 'SF Mono', Menlo, monospace; } summary .what { color:var(--muted); font-size:14px; margin-left:4px; }
  summary .grow { flex:1; min-width:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .try { background:var(--panel-2); border:1px dashed var(--line-2); border-radius:12px; padding:14px 16px; margin:14px 0; }
  .try h4 { margin:0 0 4px; font-size:14px; } .try p { margin:0 0 10px; font-size:13px; color:var(--muted); }
  .try .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .try input { flex:1; min-width:140px; background:var(--panel); color:var(--text); border:1px solid var(--line-2); border-radius:8px; padding:7px 10px; font:13px inherit; }
  .btn { background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:7px 14px; font-weight:600; font-size:13.5px; } .btn.alt { background:var(--panel); color:var(--text); border:1px solid var(--line-2); font-weight:500; }
  .btn:disabled { opacity:.55; cursor:default; }
  .out { margin-top:10px; } .out .status { font:600 12.5px ui-monospace, monospace; margin-bottom:4px; } .out .status.ok { color:var(--ok); } .out .status.bad { color:var(--bad); }
  .out pre { margin:0; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; font:12.5px/1.55 ui-monospace, monospace; overflow:auto; max-height:260px; }

  .flow { display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; margin:16px 0; }
  .flow > div { flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--text-2); } .flow b { display:block; color:var(--text); margin-bottom:2px; }
  .flow .arrow { flex:0; min-width:0; background:none; border:0; padding:0; align-self:center; color:var(--muted); }
  footer { margin-top:70px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }

  @media (max-width: 900px) { header { position:static; } html { scroll-padding-top:12px; } .wrap { display:block; padding:0 16px; } nav { position:static; max-height:none; padding:14px 0; display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); } nav h6 { display:none; } nav a { background:var(--panel); border:1px solid var(--line); } h1 { font-size:28px; } .bar { padding:10px 16px; } .field input { width:100%; max-width:none; } .field { flex:1; min-width:100%; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><i>W</i>WhatsApp API</div>
    <label class="field">Your server <input id="base" spellcheck="false" autocomplete="off" aria-label="Your server address"></label>
    <label class="field">Your key <input id="key" type="password" placeholder="wak_… (optional)" spellcheck="false" autocomplete="off" aria-label="Your API key"></label>
    <a class="back" href="/">← Dashboard</a>
  </div>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="doc"></main>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inl = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

const state = {
  lang: localStorage.getItem('docs.lang') || 'curl',
  base: '', key: '',
  type: 'text',
};
const LANGS = [['curl', 'curl'], ['node', 'Node.js'], ['python', 'Python']];
const baseUrl = () => (state.base || location.origin + '/v1').replace(/\/+$/, '');
const keyText = () => state.key || 'YOUR_API_KEY';

/* ---------- code samples, generated from one request description ---------- */
const jsStr = (s) => JSON.stringify(s);
function toPy(v, ind = 0) {
  const pad = '    '.repeat(ind + 1), end = '    '.repeat(ind);
  if (v === null) return 'None'; if (v === true) return 'True'; if (v === false) return 'False';
  if (typeof v === 'string') return JSON.stringify(v);
  if (typeof v !== 'object') return String(v);
  if (Array.isArray(v)) return v.length ? `[\n${v.map((x) => pad + toPy(x, ind + 1)).join(',\n')}\n${end}]` : '[]';
  const keys = Object.keys(v);
  return keys.length ? `{\n${keys.map((k) => `${pad}${JSON.stringify(k)}: ${toPy(v[k], ind + 1)}`).join(',\n')}\n${end}}` : '{}';
}
const shq = (s) => s.replace(/'/g, `'\\''`); // safe inside single quotes in a shell

// req: { method, path, body?, idem? }
function sample(lang, req) {
  const url = baseUrl() + req.path, key = keyText();
  const hasBody = req.body !== undefined;
  if (lang === 'curl') {
    const parts = [`curl${req.method === 'GET' ? '' : ` -X ${req.method}`} ${url.includes('?') ? `"${url}"` : url}`, `  -H "Authorization: Bearer ${key}"`];
    if (req.idem) parts.push(`  -H "Idempotency-Key: ${req.idem}"`);
    if (hasBody) parts.push('  -H "Content-Type: application/json"', `  -d '${shq(JSON.stringify(req.body, null, 2))}'`);
    return parts.join(' \\\n');
  }
  if (lang === 'node') {
    const h = [`"Authorization": "Bearer ${key}"`]; if (req.idem) h.push(`"Idempotency-Key": ${jsStr(req.idem)}`); if (hasBody) h.push('"Content-Type": "application/json"');
    const opts = [`  method: "${req.method}",`, `  headers: {\n    ${h.join(',\n    ')},\n  },`];
    if (hasBody) opts.push(`  body: JSON.stringify(${JSON.stringify(req.body, null, 2).replace(/\n/g, '\n  ')}),`);
    return `const res = await fetch(${jsStr(url)}, {\n${opts.join('\n')}\n});\nconsole.log(res.status, await res.json());`;
  }
  const h = [`"Authorization": "Bearer ${key}"`]; if (req.idem) h.push(`"Idempotency-Key": ${jsStr(req.idem)}`);
  const call = `requests.${req.method.toLowerCase()}`;
  const head = `headers={${h.join(', ')}}`;
  if (!hasBody) return `import requests\n\nr = ${call}(${jsStr(url)}, ${head})\nprint(r.status_code, r.json())`;
  return `import requests\n\nr = ${call}(\n    ${jsStr(url)},\n    ${head},\n    json=${toPy(req.body, 1)},\n)\nprint(r.status_code, r.json())`;
}

/* ---------- tiny syntax colours ---------- */
function hl(code) {
  const re = /("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')(\s*:)?|(\/\/[^\n]*|#[^\n]*)|\b(\d+(?:\.\d+)?)\b|\b(const|await|import|from|print|true|false|null|True|False|None|curl|require|new|function|return|if|def|else)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += m[2] ? `<span class="t-k">${esc(m[1])}</span>${esc(m[2])}` : `<span class="t-s">${esc(m[1])}</span>`;
    else if (m[3]) out += `<span class="t-c">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="t-n">${m[4]}</span>`;
    else out += `<span class="t-kw">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const codeBox = (code, solo = true) => `<div class="code${solo ? ' solo' : ''}"><button class="cp" type="button">Copy</button><pre>${hl(code)}</pre></div>`;
const json = (o) => codeBox(JSON.stringify(o, null, 2));

// A request shown in every language, tabs on top. `id` makes the box re-render when the language, server or key changes.
let live = 0; const liveBoxes = new Map();
function requestBox(req, custom) {
  const id = `rb${live++}`; liveBoxes.set(id, { req, custom });
  return `<div data-live="${id}">${renderLive(id)}</div>`;
}
function renderLive(id) {
  const { req, custom } = liveBoxes.get(id);
  const code = custom ? custom[state.lang] || custom.curl : sample(state.lang, req);
  return `<div class="tabs">${LANGS.map(([k, n]) => `<button type="button" data-lang="${k}" class="${k === state.lang ? 'on' : ''}">${n}</button>`).join('')}</div>${codeBox(code, false)}`;
}
function refreshLive() { document.querySelectorAll('[data-live]').forEach((d) => { d.innerHTML = renderLive(d.dataset.live); }); const t = $('#typeBody'); if (t) t.innerHTML = typeBody(); }

/* ---------- content ---------- */
const NUM = '923001234567';
const TYPES = [
  { id: 'text', label: 'Text', blurb: 'A plain text message.', body: { to: NUM, type: 'text', text: 'Hi Sara, your order is ready for pickup.' },
    fields: [['to', 1, 'The customer\'s phone number with country code, digits only.'], ['text', 1, 'Up to 4096 characters.'], ['reply_to', 0, 'The id of an earlier message in this chat to quote.']] },
  { id: 'image', label: 'Image', blurb: 'A photo with an optional caption.', body: { to: NUM, type: 'image', media: { url: 'https://example.com/menu.jpg' }, caption: "Today's menu" },
    fields: [['to', 1, 'Phone number.'], ['media', 1, 'The file: a link, base64, or an upload. See "Sending files".'], ['caption', 0, 'Text under the picture, up to 1024 characters.']], note: 'JPEG, PNG, GIF or WebP, up to 5 MB.' },
  { id: 'video', label: 'Video', blurb: 'A video, or a short looping clip.', body: { to: NUM, type: 'video', media: { url: 'https://example.com/promo.mp4' }, caption: 'New arrivals', gif: false },
    fields: [['to', 1, 'Phone number.'], ['media', 1, 'The file.'], ['caption', 0, 'Text under the video.'], ['gif', 0, 'true plays it as a looping GIF.']], note: 'MP4, 3GP or WebM, up to 16 MB.' },
  { id: 'voice', label: 'Voice note', blurb: 'Appears as a voice message with the microphone icon and waveform. Any audio format works: it is converted for you.', body: { to: NUM, type: 'voice', media: { url: 'https://example.com/hello.mp3' } },
    fields: [['to', 1, 'Phone number.'], ['media', 1, 'An audio file.']], note: 'Up to 16 MB. Needs ffmpeg on the server (the Docker image has it).' },
  { id: 'audio', label: 'Audio file', blurb: 'An audio file the customer can play, shown as a file rather than a voice note.', body: { to: NUM, type: 'audio', media: { url: 'https://example.com/song.mp3' } },
    fields: [['to', 1, 'Phone number.'], ['media', 1, 'An audio file.']], note: 'Up to 16 MB.' },
  { id: 'document', label: 'Document', blurb: 'Any file: PDF, Word, Excel, ZIP...', body: { to: NUM, type: 'document', media: { url: 'https://example.com/invoice-1042.pdf' }, filename: 'Invoice-1042.pdf', caption: 'Your invoice' },
    fields: [['to', 1, 'Phone number.'], ['media', 1, 'The file.'], ['filename', 0, 'The name the customer sees.'], ['caption', 0, 'A short note with the file.']], note: 'Up to 50 MB.' },
  { id: 'sticker', label: 'Sticker', blurb: 'A WebP sticker.', body: { to: NUM, type: 'sticker', media: { url: 'https://example.com/thanks.webp' } },
    fields: [['to', 1, 'Phone number.'], ['media', 1, 'A WebP image.']], note: 'WebP only, up to 1 MB.' },
  { id: 'location', label: 'Location', blurb: 'A map pin.', body: { to: NUM, type: 'location', latitude: 24.8607, longitude: 67.0011, name: 'Our shop', address: 'Karachi' },
    fields: [['to', 1, 'Phone number.'], ['latitude', 1, 'A number from -90 to 90.'], ['longitude', 1, 'A number from -180 to 180.'], ['name', 0, 'Place name.'], ['address', 0, 'Street address.']] },
  { id: 'contact', label: 'Contact card', blurb: 'Share one or more contacts that can be saved in one tap.', body: { to: NUM, type: 'contact', contacts: [{ name: 'Sara Ahmed', phone: '923001234567' }] },
    fields: [['to', 1, 'Phone number.'], ['contacts', 1, 'A list of 1 to 10 people, each with a name and a phone.']] },
  { id: 'reaction', label: 'Reaction', blurb: 'React to a message with an emoji.', body: { to: NUM, type: 'reaction', message_id: '3EB0C767D0A6F3A1B2', emoji: '👍' },
    fields: [['to', 1, 'Phone number of the chat.'], ['message_id', 1, 'The id of the message to react to.'], ['emoji', 1, 'One emoji. Leave it empty to remove your reaction.']] },
];
const typeBody = () => {
  const t = TYPES.find((x) => x.id === state.type);
  return `<div class="panel"><p>${inl(t.blurb)}</p>
    <div class="tbl"><table><thead><tr><th>Field</th><th>Notes</th></tr></thead><tbody>
    ${t.fields.map(([n, r, d]) => `<tr><td><code>${n}</code>${r ? '<span class="req">required</span>' : '<span class="opt">optional</span>'}</td><td>${inl(d)}</td></tr>`).join('')}
    </tbody></table></div>${t.note ? `<p class="hint">${inl(t.note)}</p>` : ''}
    ${(() => { const id = `rb${live++}`; liveBoxes.set(id, { req: { method: 'POST', path: '/messages', body: t.body } }); return `<div data-live="${id}">${renderLive(id)}</div>`; })()}

// Use the RAW body (before JSON parsing).
app.post("/whatsapp-events", express.raw({ type: "application/json" }), (req, res) => {
  const ts = req.get("X-Webhook-Timestamp");
  const expected = "v1=" + crypto.createHmac("sha256", process.env.WEBHOOK_SECRET)
    .update(ts + "." + req.body).digest("hex");
  const given = req.get("X-Webhook-Signature") || "";

  const ok = given.length === expected.length &&
    crypto.timingSafeEqual(Buffer.from(given), Buffer.from(expected));
  const fresh = Math.abs(Date.now() / 1000 - Number(ts)) < 300; // reject old requests
  if (!ok || !fresh) return res.sendStatus(401);

  res.sendStatus(200); // answer first, then do the work
  const event = JSON.parse(req.body);
  console.log(event.type, event.data);
});`;
  const verifyPy = `import hmac, hashlib, time, json
from flask import Flask, request, abort

@app.post("/whatsapp-events")
def events():
    ts = request.headers.get("X-Webhook-Timestamp", "")
    raw = request.get_data()  # the RAW body
    expected = "v1=" + hmac.new(SECRET.encode(), ts.encode() + b"." + raw, hashlib.sha256).hexdigest()
    given = request.headers.get("X-Webhook-Signature", "")

    if not hmac.compare_digest(given, expected) or abs(time.time() - int(ts)) > 300:
        abort(401)

    event = json.loads(raw)
    print(event["type"], event["data"])
    return "", 200`;

document.addEventListener('click', async (e) => {
  const lang = e.target.closest('[data-lang]');
  if (lang) { state.lang = lang.dataset.lang; localStorage.setItem('docs.lang', state.lang); refreshLive(); return; }
  const chip = e.target.closest('[data-type]');
  if (chip) { state.type = chip.dataset.type; document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip)); $('#typeBody').innerHTML = typeBody(); return; }
  const v = e.target.closest('[data-vtab]');
  if (v) { document.querySelectorAll('[data-vtab]').forEach((b) => b.classList.toggle('on', b === v)); $('#vcode pre').innerHTML = hl(built.verify[v.dataset.vtab]); return; }
  const cp = e.target.closest('.cp');
  if (cp) {
    try { await navigator.clipboard.writeText(cp.parentElement.querySelector('pre').textContent); cp.textContent = 'Copied'; cp.classList.add('done'); } catch { cp.textContent = 'Copy failed'; }
    setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('done'); }, 1400);
  }
});

  out.innerHTML = '<div class="status">Sending…</div>';
  try {
    const res = await fetch(baseUrl() + path, { ...init, headers: { Authorization: `Bearer ${state.key}`, ...(init.body ? { 'Content-Type': 'application/json' } : {}) } });
    const text = await res.text(); let shown = text; try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    out.innerHTML = `<div class="status ${res.ok ? 'ok' : 'bad'}">${label}: ${res.status} ${res.ok ? 'OK' : 'failed'}</div><pre>${esc(shown)}</pre>`;
  } catch (err) {
    out.innerHTML = `<div class="status bad">Could not reach ${esc(baseUrl())}</div><pre>${esc(err.message)}\n\nThis page can only call the server it was opened from.</pre>`;
  }
}
$('#tryKey').onclick = () => run('Key check', '/business', { method: 'GET' });
$('#trySend').onclick = () => {
  const to = $('#tryTo').value.trim(), text = $('#tryText').value.trim();
  if (!to || !text) { $('#tryOut').innerHTML = '<div class="status bad">Enter a phone number and a message.</div>'; return; }
  run('Send', '/messages', { method: 'POST', body: JSON.stringify({ to, type: 'text', text }) });
};

/* highlight where you are */
const links = [...document.querySelectorAll('#nav a')], heads = links.map((a) => document.getElementById(a.getAttribute('href').slice(1)));
const spy = () => { let cur = 0; heads.forEach((h, i) => { if (h.getBoundingClientRect().top < 140) cur = i; }); links.forEach((a, i) => a.classList.toggle('on', i === cur)); };
addEventListener('scroll', spy, { passive: true }); spy();
if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
</script>
