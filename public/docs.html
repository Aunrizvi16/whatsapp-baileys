<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API guide</title>
<style>
  :root { color-scheme: dark; --bg:#08090a; --panel:#101113; --panel-2:#16171a; --line:#23252a; --text:#f7f8f8; --text-2:#c9ccd1; --muted:#8a8f98; --link:#8fb4ff; --code:#e6c07b; --ok:#4cb782; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#fff; --panel:#f7f7f8; --panel-2:#f0f0f2; --line:#e3e4e8; --text:#111214; --text-2:#3b3d42; --muted:#6b6f78; --link:#2457d6; --code:#8a4b00; --ok:#18794e; } }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:20px; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.65 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
  .wrap { display:grid; grid-template-columns:250px minmax(0, 1fr); max-width:1180px; margin:0 auto; }
  nav { position:sticky; top:0; align-self:start; height:100vh; overflow:auto; padding:28px 18px 28px 24px; border-right:1px solid var(--line); }
  nav .brand { display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:4px; }
  nav .brand span { width:22px; height:22px; border-radius:6px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-size:12px; }
  nav small { display:block; color:var(--muted); margin-bottom:18px; }
  nav a { display:block; padding:5px 10px; margin:1px 0; border-radius:6px; color:var(--text-2); text-decoration:none; font-size:13.5px; }
  nav a:hover { background:var(--panel-2); color:var(--text); }
  nav a.on { background:var(--panel-2); color:var(--text); font-weight:600; }
  nav .back { margin-top:18px; color:var(--muted); font-size:13px; }
  main { padding:36px 40px 120px; min-width:0; max-width:860px; }
  h1 { font-size:30px; line-height:1.2; margin:0 0 10px; letter-spacing:-.02em; }
  h2 { font-size:22px; margin:52px 0 12px; padding-top:28px; border-top:1px solid var(--line); letter-spacing:-.01em; }
  h1 + p + ul + hr + h2, h2:first-of-type { }
  h3 { font-size:16px; margin:28px 0 8px; }
  p { margin:10px 0; color:var(--text-2); }
  a { color:var(--link); }
  strong { color:var(--text); }
  hr { border:0; margin:0; }
  ul, ol { padding-left:22px; margin:10px 0; color:var(--text-2); } li { margin:4px 0; } li > ul, li > ol { margin:4px 0; }
  code { font:12.8px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; background:var(--panel-2); border:1px solid var(--line); padding:1px 6px; border-radius:5px; color:var(--code); overflow-wrap:anywhere; }
  .code { position:relative; margin:14px 0; }
  .code pre { margin:0; padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  .code pre code { background:none; border:0; padding:0; color:var(--text); font-size:12.8px; overflow-wrap:normal; white-space:pre; }
  .code .lang { position:absolute; left:14px; top:-9px; background:var(--bg); padding:0 6px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .code button { position:absolute; right:8px; top:8px; background:var(--panel-2); color:var(--text-2); border:1px solid var(--line); border-radius:6px; font:12px inherit; padding:3px 9px; cursor:pointer; opacity:0; transition:opacity .12s; }
  .code:hover button, .code button:focus { opacity:1; } .code button.done { color:var(--ok); opacity:1; }
  .tbl { overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:left; vertical-align:top; padding:9px 14px; border-bottom:1px solid var(--line); color:var(--text-2); }
  th { background:var(--panel); color:var(--text); font-weight:600; white-space:nowrap; } tr:last-child td { border-bottom:0; }
  td code { white-space:nowrap; }
  .loading, .failed { padding:60px 40px; color:var(--muted); }
  @media (max-width: 820px) { .wrap { display:block; } nav { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); } main { padding:24px 18px 80px; } }
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav">
    <div class="brand"><span>W</span>API guide</div>
    <small>For other systems</small>
    <div id="toc"></div>
    <a class="back" href="/">← Back to the dashboard</a>
  </nav>
  <main id="doc"><div class="loading">Loading…</div></main>
</div>

<script>
// Shows API.md as a page: the guide is written once, as Markdown, and rendered here.
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const slug = (t) => t.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

// Inline: `code`, **bold**, [links](url). Code spans are lifted out first so nothing inside them is touched.
function inline(text) {
  const spans = [];
  let t = text.replace(/`([^`]+)`/g, (m, c) => { spans.push(`<code>${esc(c)}</code>`); return `\u0000${spans.length - 1}\u0000`; });
  t = esc(t)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => `<a href="${href.startsWith('#') || /^(\/|https?:)/.test(href) ? href : '#'}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''}>${label}</a>`);
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => spans[i]);
}

function table(rows) {
  const cells = (r) => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
  const head = cells(rows[0]);
  return `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${
    rows.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// Lists, nested by indentation (two spaces per level).
function list(lines) {
  const out = [];
  const stack = []; // { indent, tag }
  const close = (to) => { while (stack.length && stack[stack.length - 1].indent >= to) out.push(`</li></${stack.pop().tag}>`); };
  for (const line of lines) {
    const m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (!m) { out.push(` ${inline(line.trim())}`); continue; } // a wrapped line of the same item
    const indent = m[1].length, tag = /\d/.test(m[2]) ? 'ol' : 'ul';
    const top = stack[stack.length - 1];
    const open = () => { out.push(`<${tag}${tag === 'ol' ? ` start="${parseInt(m[2], 10)}"` : ''}><li>`); stack.push({ indent, tag }); };
    if (!top || indent > top.indent) open();
    else { close(indent + 1); const t = stack[stack.length - 1]; if (t && t.indent === indent) out.push('</li><li>'); else open(); }
    out.push(inline(m[3]));
  }
  close(0);
  return out.join('');
}

function render(md) {
  const lines = md.replace(/\r/g, '').split('\n');
  const html = [], toc = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = /^```(\w*)/.exec(line))) {
      const body = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) body.push(lines[i]);
      i++;
      const lang = m[1] === 'jsonc' ? 'json' : m[1];
      html.push(`<div class="code">${lang ? `<span class="lang">${esc(lang)}</span>` : ''}<button type="button">Copy</button><pre><code>${esc(body.join('\n'))}</code></pre></div>`);
    } else if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) {
      const level = m[1].length, plain = m[2].replace(/`/g, '');
      const id = slug(plain);
      if (level === 2) toc.push({ id, text: plain });
      html.push(`<h${level} id="${id}">${inline(m[2])}</h${level}>`);
      i++;
    } else if (/^\|/.test(line) && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1] || '')) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      html.push(table(rows));
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const items = [];
      while (i < lines.length && lines[i].trim() && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) items.push(lines[i++]);
      html.push(list(items));
    } else if (/^---+\s*$/.test(line)) {
      i++;
    } else if (!line.trim()) {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|\||\s*([-*]|\d+\.)\s|---)/.test(lines[i])) para.push(lines[i++]);
      html.push(`<p>${inline(para.join(' '))}</p>`);
    }
  }
  return { html: html.join('\n'), toc };
}

(async () => {
  const doc = document.getElementById('doc');
  try {
    const res = await fetch('/api-guide.md');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { html, toc } = render(await res.text());
    doc.innerHTML = html;
    document.getElementById('toc').innerHTML = toc.map((t) => `<a href="#${t.id}">${esc(t.text)}</a>`).join('');
    document.title = doc.querySelector('h1')?.textContent || 'API guide';
  } catch (e) {
    doc.innerHTML = `<div class="failed">The guide could not be loaded (${esc(e.message)}).</div>`;
    return;
  }
  doc.addEventListener('click', async (e) => {
    const b = e.target.closest('.code button');
    if (!b) return;
    try { await navigator.clipboard.writeText(b.parentElement.querySelector('code').textContent); b.textContent = 'Copied'; b.classList.add('done'); }
    catch { b.textContent = 'Copy failed'; }
    setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1500);
  });
  // Highlight the section being read.
  const links = [...document.querySelectorAll('#toc a')];
  const heads = links.map((a) => document.getElementById(a.getAttribute('href').slice(1)));
  const mark = () => {
    let cur = 0;
    heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) cur = k; });
    links.forEach((a, k) => a.classList.toggle('on', k === cur));
  };
  addEventListener('scroll', mark, { passive: true });
  mark();
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
})();
</script>
</body>
</html>
