<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Sessions</title>
<script>document.documentElement.dataset.theme = (() => { try { return localStorage.getItem("theme"); } catch {} })() || "dark";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens (Linear-style: dark first, light on request) ---- */
  :root, :root[data-theme="dark"] {
    --bg:#08090a; --side:#08090a; --surface:#0f1011; --panel:#141516; --panel-2:#1a1b1e; --hover:rgba(255,255,255,.045); --active:rgba(255,255,255,.075);
    --line:#1f2023; --line-2:#2c2d31;
    --text:#ffffff; --text-2:#d0d6e0; --muted:#8a8f98; --faint:#62666d;
    --accent:#ffffff; --accent-2:#e3e5e8; --on-accent:#08090a; --accent-soft:rgba(255,255,255,.07); --accent-ring:rgba(255,255,255,.22);
    --ok:#4ccf7f; --warn:#e0a52c; --bad:#ef5b57; --info:#4c9aff;
    --ok-bg:rgba(76,207,127,.13); --warn-bg:rgba(224,165,44,.13); --bad-bg:rgba(239,91,87,.12);
    --shadow:0 12px 40px rgba(0,0,0,.6), 0 0 0 1px var(--line-2);
    color-scheme:dark;
  }
  :root[data-theme="light"] {
    --bg:#f1f2f4; --side:#f1f2f4; --surface:#ffffff; --panel:#ffffff; --panel-2:#f4f5f7; --hover:rgba(8,9,10,.04); --active:rgba(8,9,10,.07);
    --line:#e6e8eb; --line-2:#d3d7dc;
    --text:#08090a; --text-2:#3b3f45; --muted:#6f737b; --faint:#9ca0a8;
    --accent:#08090a; --accent-2:#2a2c30; --on-accent:#ffffff; --accent-soft:rgba(8,9,10,.06); --accent-ring:rgba(8,9,10,.18);
    --ok:#1f9d57; --warn:#a96d00; --bad:#d23f3f; --info:#2b74d1;
    --ok-bg:rgba(31,157,87,.10); --warn-bg:rgba(169,109,0,.10); --bad-bg:rgba(210,63,63,.08);
    --shadow:0 12px 40px rgba(8,9,10,.16), 0 0 0 1px var(--line-2);
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; font:400 14px/1.5 'Hanken Grotesk', -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text-2); }
  [hidden] { display:none !important; }
  h1, h2, h3, strong, b { color:var(--text); font-weight:600; letter-spacing:-.01em; }
  ::selection { background:var(--accent-ring); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  kbd.onacc { color:inherit; border-color:color-mix(in srgb, currentColor 40%, transparent); opacity:.8; }
  kbd { font:500 11px/1 'Hanken Grotesk', sans-serif; color:var(--muted); border:1px solid var(--line-2); border-radius:4px; padding:2px 5px; }

  /* ---- Controls ---- */
  input, select, button, textarea { font:inherit; font-size:14px; border-radius:8px; }
  input, select, textarea { height:34px; padding:0 12px; border:1px solid var(--line-2); background:var(--panel-2); color:var(--text); outline:none; transition:border-color .12s, box-shadow .12s; }
  textarea { height:auto; min-height:70px; padding:8px 10px; resize:vertical; line-height:1.5; }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
  input[type=checkbox], input[type=radio] { height:auto; accent-color:var(--accent); }
  button { height:34px; padding:0 14px; background:var(--accent); color:var(--on-accent); border:1px solid transparent; cursor:pointer; font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; transition:background .12s, border-color .12s, color .12s; }
  button:hover { background:var(--accent-2); }
  button:focus-visible { outline:2px solid var(--accent-2); outline-offset:2px; }
  button.alt { background:var(--active); color:var(--text); border-color:transparent; }
  button.alt:hover { background:var(--line-2); }
  button.ghost { background:transparent; color:var(--bad); border-color:var(--line-2); }
  button.ghost:hover { background:var(--bad-bg); border-color:var(--bad); }
  button.link { background:none; color:var(--accent); padding:0 2px; height:auto; text-decoration:none; font-weight:500; }
  button.link:hover { background:none; text-decoration:underline; }
  button.link.danger { color:var(--bad); font-size:12px; align-self:flex-start; opacity:.85; margin-top:2px; }
  button:disabled { opacity:.45; cursor:default; pointer-events:none; }
  .row { display:flex; gap:8px; } .row input { flex:1; min-width:0; }
  .msg { font-size:13px; min-height:1em; white-space:pre-wrap; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .hint, .sub { color:var(--muted); font-size:12.5px; line-height:1.5; font-weight:400; }
  .badge { background:var(--accent); color:var(--on-accent); border-radius:99px; padding:0 6px; font-size:11px; line-height:16px; font-weight:600; min-width:16px; text-align:center; }
  .empty { color:var(--muted); text-align:center; padding:72px 16px; border:1px dashed var(--line-2); border-radius:12px; grid-column:1 / -1; }
  .empty b { display:block; color:var(--text); font-size:15px; margin-bottom:4px; }

  /* ---- App shell ---- */
  .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  .shell:has(#me[hidden]) { grid-template-columns:1fr; }
  .side { position:sticky; top:0; height:100vh; background:var(--side); display:flex; flex-direction:column; padding:14px 10px 12px; gap:2px; }
  .ws { display:flex; align-items:center; gap:10px; padding:2px 6px 16px; color:var(--text); font-weight:600; font-size:17px; letter-spacing:-.02em; }
  .ws .plus { margin-left:auto; width:36px; height:36px; padding:0; border-radius:50%; background:var(--text); color:var(--bg); } .ws .plus:hover { background:var(--text-2); }
  .ws .plus svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
  .logo { width:24px; height:24px; border-radius:7px; background:var(--text); display:grid; place-items:center; color:var(--bg); font-size:13px; font-weight:700; flex:none; }
  .nav { width:100%; justify-content:flex-start; height:32px; background:transparent; color:var(--text-2); font-weight:400; font-size:14.5px; padding:0 12px; gap:10px; border:none; border-radius:10px; }
  .nav:hover { background:var(--hover); color:var(--text); } .nav.on { background:var(--active); color:var(--text); font-weight:500; }
  .nav .badge { margin-left:auto; }
  .nav svg, .iconbtn svg { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .spacer { flex:1; }
  .acct { display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; padding:8px; border-radius:12px; border:1px solid var(--line); background:var(--panel); }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--text); color:var(--bg); display:grid; place-items:center; font-size:14px; font-weight:600; flex:none; }
  .acct .who1 { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
  .acct #meName { color:var(--text); font-weight:500; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .role { white-space:nowrap; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .role.super_admin { color:#f2b84c; } .role.admin { color:var(--info); }
  .iconbtn { width:28px; height:28px; padding:0; background:transparent; color:var(--muted); border:none; }
  .iconbtn:hover { background:var(--hover); color:var(--text); }
  .acctbtns { display:flex; gap:2px; width:100%; padding-top:6px; border-top:1px solid var(--line); }
  .acctbtns .iconbtn:last-child { margin-left:auto; }
  main { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin:8px 8px 8px 0; min-height:calc(100vh - 16px); }
  .shell:has(#me[hidden]) main { background:transparent; border:none; border-radius:0; margin:0; min-height:100vh; }
  .top-bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:0 24px; height:68px; background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(10px); border-radius:12px 12px 0 0; }
  .top-bar h1 { margin:0; font-size:19px; font-weight:500; letter-spacing:-.025em; }
  .tile { width:36px; height:36px; border-radius:10px; background:var(--text); display:grid; place-items:center; flex:none; } .tile svg { width:18px; height:18px; stroke:var(--bg); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .top-bar .count { color:var(--muted); font-size:13px; background:var(--active); border-radius:99px; padding:1px 9px; }
  .top-bar .grow { flex:1; }
  .top-bar button { height:34px; font-size:14px; }
  #allMsg { color:var(--muted); font-size:12.5px; }
  .content { padding:0 24px 32px; max-width:1280px; }
  .toolbar2 { display:flex; align-items:center; gap:4px; padding:4px 0 12px; flex-wrap:wrap; }
  .toolbar2 button.f { height:32px; background:transparent; color:var(--muted); font-weight:400; padding:0 10px; }
  .toolbar2 button.f:hover { background:var(--hover); color:var(--text); } .toolbar2 button.f.on { background:var(--active); color:var(--text); font-weight:500; }
  .toolbar2 .grow { flex:1; } .toolbar2 input { height:32px; width:220px; max-width:100%; }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:18px; }
  .stat { padding:12px 16px; display:flex; flex-direction:column; gap:6px; border-right:1px solid var(--line); min-width:0; } .stat:last-child { border-right:none; }
  .stat .lbl { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); } .stat .lbl i { width:8px; height:8px; border-radius:50%; background:var(--faint); }
  .stat .val { font-size:22px; font-weight:500; color:var(--text); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .stat.ok .lbl i { background:var(--ok); } .stat.warn .lbl i { background:var(--warn); } .stat.bad .lbl i { background:var(--bad); }
  @media (max-width:640px) { .stats { grid-template-columns:repeat(2, 1fr); } .stat:nth-child(2) { border-right:none; } .stat:nth-child(-n+2) { border-bottom:1px solid var(--line); } }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:14px; align-items:start; }

  /* ---- Sign in ---- */
  #login { max-width:360px; margin:12vh auto 0; padding:0 16px; display:flex; flex-direction:column; gap:18px; }
  #login .brand { display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
  #login .brand .logo { width:44px; height:44px; border-radius:13px; font-size:22px; }
  #login h2 { margin:0; font-size:20px; letter-spacing:-.01em; }
  .authTabs { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; }
  .authTabs button { background:transparent; color:var(--muted); height:28px; }
  .authTabs button:hover { background:var(--hover); }
  .authTabs button.on { background:var(--active); color:var(--text); }
  #authForm { display:flex; flex-direction:column; gap:10px; }
  #authForm input { height:40px; }
  #authForm button { height:40px; margin-top:4px; }
  #loginMsg { text-align:center; }

  /* ---- Business card ---- */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; transition:border-color .15s; }
  .card:hover { border-color:var(--line-2); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:600; font-size:15px; color:var(--text); word-break:break-all; letter-spacing:-.01em; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:2px 8px 2px 7px; border-radius:99px; color:var(--muted); background:var(--panel-2); border:1px solid var(--line); white-space:nowrap; }
  .pill::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--faint); }
  .pill.ready { color:var(--ok); background:var(--ok-bg); border-color:transparent; } .pill.ready::before { background:var(--ok); }
  .pill.qr, .pill.code, .pill.retrying, .pill.requesting_code, .pill.starting, .pill.restarting { color:var(--warn); background:var(--warn-bg); border-color:transparent; }
  .pill.qr::before, .pill.code::before, .pill.retrying::before, .pill.requesting_code::before, .pill.starting::before, .pill.restarting::before { background:var(--warn); }
  .pill.error, .pill.auth_failure { color:var(--bad); background:var(--bad-bg); border-color:transparent; } .pill.error::before, .pill.auth_failure::before { background:var(--bad); }
  .meta { color:var(--muted); font-size:13px; margin-top:-6px; }
  .stage { display:flex; flex-direction:column; gap:8px; }
  .stage .line { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  .stage .line span:last-child { color:var(--muted); font-variant-numeric:tabular-nums; }
  .progress { height:3px; background:var(--line); border-radius:99px; overflow:hidden; }
  .progress div { height:100%; background:var(--accent); transition:width .4s; border-radius:99px; }
  .progress.busy div { width:35%; animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { margin-left:-35%; } to { margin-left:100%; } }
  .slow { background:var(--warn-bg); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius:8px; padding:10px 12px; font-size:13px; display:flex; flex-direction:column; gap:6px; color:var(--text-2); }
  div.qr { background:#fff; border-radius:10px; padding:14px; } .qr img { width:100%; max-width:240px; display:block; margin:0 auto; image-rendering:pixelated; }
  div.qr p { text-align:center; color:#555; margin:8px 0 0; font-size:12.5px; }
  div.code { text-align:center; } div.code b { display:block; font-size:30px; letter-spacing:.25em; margin:6px 0; font-variant-numeric:tabular-nums; }
  div.code ol { text-align:left; color:var(--muted); font-size:13px; margin:8px 0 0; padding-left:18px; }
  form.send { display:flex; flex-direction:column; gap:8px; padding-top:4px; }
  .auto { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:13px; padding-top:12px; border-top:1px solid var(--line); }
  .auto b.on { color:var(--ok); } .auto b.off { color:var(--muted); font-weight:500; }
  .auto button { height:26px; font-size:13px; }
  .web { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--panel-2); }
  .web .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg); }
  .web.warn .dot { background:var(--warn); box-shadow:0 0 0 3px var(--warn-bg); } .web.bad .dot { background:var(--bad); box-shadow:0 0 0 3px var(--bad-bg); }
  .web.bad { background:var(--bad-bg); } .web.warn { background:var(--warn-bg); }
  .web .txt { flex:1; min-width:140px; color:var(--text); } .web .sub { display:block; }
  .web button { height:26px; font-size:12.5px; }

  /* ---- Dialogs ---- */
  dialog { border:none; border-radius:16px; padding:0; width:min(640px, calc(100vw - 32px)); max-height:calc(100vh - 48px); color:var(--text-2); background:var(--panel); box-shadow:var(--shadow); }
  dialog[open] { animation:pop .14s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(6px) scale(.985); } to { opacity:1; transform:none; } }
  dialog::backdrop { background:rgba(0,0,0,.6); backdrop-filter:blur(2px); }
  dialog.narrow { width:min(440px, calc(100vw - 32px)); }
  dialog form { display:flex; flex-direction:column; gap:16px; padding:20px; }
  dialog h2 { margin:0; font-size:16px; letter-spacing:-.01em; }
  dialog h3 { margin:6px 0 0; font-size:14px; }
  dialog label, #rulesView label { display:flex; flex-direction:column; gap:6px; font-weight:500; color:var(--text); font-size:13px; }
  dialog label small, dialog label .hint, #rulesView label small, #rulesView label .hint { color:var(--muted); font-weight:400; font-size:12.5px; }
  #rPrompt { min-height:220px; }
  #rulesView h2, #rulesView h3 { margin:0; }
  .check { flex-direction:row !important; align-items:center; gap:10px !important; font-size:14px !important; }
  .check input { width:16px; height:16px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .modes label { flex-direction:row; gap:10px; align-items:flex-start; border:1px solid var(--line-2); border-radius:8px; padding:10px 12px; cursor:pointer; transition:border-color .12s, background .12s; }
  .modes label:hover { background:var(--hover); }
  .modes label:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .modes input { margin-top:3px; } .modes small { color:var(--muted); font-weight:400; }
  .modes.three { grid-template-columns:repeat(3, 1fr); }
  @media (max-width:560px) { .modes, .modes.three { grid-template-columns:1fr; } }
  .nums { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; } .nums input { min-width:0; }
  .kw { border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--panel-2); }
  .test { border:1px dashed var(--line-2); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .test .out { background:var(--ok-bg); color:var(--text); border-radius:8px; padding:10px 12px; white-space:pre-wrap; }
  .actions { display:flex; gap:8px; justify-content:flex-end; position:sticky; bottom:0; background:var(--panel); padding:12px 0 0; margin-top:-4px; border-top:1px solid var(--line); }
  .who { display:flex; flex-direction:column; gap:10px; }
  .picker { display:flex; flex-direction:column; gap:10px; border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--panel-2); }
  .whoList { max-height:260px; overflow-y:auto; display:flex; flex-direction:column; }
  .whoList label { flex-direction:row !important; align-items:center; gap:10px; font-weight:400; padding:7px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .whoList label:last-child { border-bottom:none; } .whoList input { width:16px; height:16px; flex:none; }
  .whoList .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); } .whoList .sub { white-space:nowrap; }

  dialog.wide { width:min(960px, calc(100vw - 32px)); }
  .dataHead { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 0; gap:12px; }
  .dataHead h2 { margin:0; }
  .tabs { display:flex; gap:2px; padding:12px 14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs button { background:none; color:var(--muted); border-radius:6px 6px 0 0; height:32px; padding:0 12px; }
  .tabs button:hover { color:var(--text); background:var(--hover); }
  .tabs button.on { color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); }
  #dataBody { padding:16px 20px 20px; display:flex; flex-direction:column; gap:8px; overflow:auto; max-height:calc(100vh - 190px); }
  .item { border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; background:var(--panel-2); }
  .item .top b { font-size:14px; } .item ul { margin:0; padding-left:18px; } .item select { height:28px; font-size:13px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:1px 8px; border-radius:99px; background:var(--panel); border:1px solid var(--line-2); color:var(--text-2); }
  .chip.good { background:var(--ok-bg); border-color:transparent; color:var(--ok); } .chip.bad { background:var(--bad-bg); border-color:transparent; color:var(--bad); }
  .logbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .logbar select { height:28px; font-size:13px; }
  .logs { font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:12px; border:1px solid var(--line); border-radius:8px; max-height:60vh; overflow:auto; background:var(--bg); }
  .log { display:flex; gap:10px; padding:4px 10px; border-bottom:1px solid var(--line); } .log:last-child { border-bottom:none; }
  .log .when { color:var(--faint); white-space:nowrap; } .log .msg { white-space:pre-wrap; word-break:break-word; }
  .log.error { background:var(--bad-bg); } .log.warn { background:var(--warn-bg); }
  .answer { display:flex; flex-direction:column; gap:8px; margin-top:6px; padding-top:10px; border-top:1px dashed var(--line-2); }
  .check.small { display:flex; align-items:center; gap:8px; font-size:12.5px !important; color:var(--muted); cursor:pointer; font-weight:400; }
  .urow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--panel-2); }

<script>
const $ = (s) => document.querySelector(s);
let me = null; // the signed-in user
const drafts = {};      // half-typed send forms, kept across redraws
const pairDrafts = {};  // half-typed phone numbers under a QR

async function api(path, opts = {}) {
  const res = await fetch(path.startsWith('/auth') ? path : '/api' + path, { ...opts, headers: { 'content-type': 'application/json' } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.startsWith('/auth/')) { showLogin('Your session ended. Please log in again.'); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showLogin(msg = '') {
  me = null; clearInterval(timer);
  $('#app').hidden = true; $('#usersView').hidden = true; $('#dataView').hidden = true; $('#usageView').hidden = true; $('#rulesView').hidden = true; $('#me').hidden = true; $('#login').hidden = false; $('#loginMsg').textContent = msg;
}

let signingUp = false;
function authMode(up) {
  signingUp = up;
  $('#tabIn').className = up ? '' : 'on'; $('#tabUp').className = up ? 'on' : '';
  $('#aName').hidden = !up; $('#aName').required = up; $('#aHint').hidden = !up;
  $('#aPass').autocomplete = up ? 'new-password' : 'current-password';
  $('#aGo').textContent = up ? 'Create account' : 'Log in';
  $('#loginTitle').textContent = up ? 'Create your account' : 'Log in to WhatsApp Sessions';
  $('#loginMsg').textContent = ''; $('#loginMsg').className = 'msg err';
}
$('#tabIn').onclick = () => authMode(false);
$('#tabUp').onclick = () => authMode(true);

$('#authForm').onsubmit = async (e) => {
  e.preventDefault();
  const out = $('#loginMsg'); out.className = 'msg err'; out.textContent = '';
  $('#aGo').disabled = true;
  try {
    const body = { email: $('#aEmail').value.trim(), password: $('#aPass').value };
    if (signingUp) {
      const r = await api('/auth/signup', { method: 'POST', body: JSON.stringify({ ...body, name: $('#aName').value.trim() }) });
      $('#aPass').value = ''; authMode(false); out.className = 'msg ok'; out.textContent = r.message;
    } else {
      me = await api('/auth/signin', { method: 'POST', body: JSON.stringify(body) });
      $('#aPass').value = '';
      start();
    }
  } catch (err) { out.textContent = err.message; }
  $('#aGo').disabled = false;
};

$('#signoutBtn').onclick = async () => {
  await api('/auth/signout', { method: 'POST' }).catch(() => {});
  showLogin();
};

$('#pwBtn').onclick = () => { $('#pwForm').reset(); $('#pwMsg').textContent = ''; $('#pwDlg').showModal(); };
$('#pwCancel').onclick = () => $('#pwDlg').close();
$('#pwForm').onsubmit = async (e) => {
  e.preventDefault();
  const out = $('#pwMsg'); out.className = 'msg err'; out.textContent = '';
  try {
    await api('/auth/password', { method: 'POST', body: JSON.stringify({ current: $('#pwCur').value, next: $('#pwNew').value }) });
    $('#pwDlg').close();
    toast('Password changed');
  } catch (err) { out.textContent = err.message; }
};

// ---- Views: Businesses / Users ----
let view = 'biz';
const isAdminUser = () => me && (me.role === 'admin' || me.role === 'super_admin');
function setView(v) {
  if (!me) return;
  if (v === 'users' && !isAdminUser()) v = 'biz';
  view = v;
  $('#rulesView').hidden = true;
  $('#app').hidden = v !== 'biz';
  $('#usersView').hidden = v !== 'users';
  $('#dataView').hidden = !DATA_VIEWS.includes(v);
  $('#usageView').hidden = v !== 'usage';
  document.querySelectorAll('.nav[data-view]').forEach((n) => n.classList.toggle('on', n.dataset.view === v));
  window.scrollTo(0, 0);
  if (v === 'users') loadUsers();
  if (DATA_VIEWS.includes(v)) openDataPage(v);
  if (v === 'usage') openUsage();
}
document.querySelectorAll('.nav[data-view]').forEach((n) => n.onclick = () => { if (confirmLeave()) { setDirty(false); setView(n.dataset.view); } });

// The business page (auto-replies editor) replaces the list until you go back.
function showRules() {
  $('#app').hidden = true; $('#usersView').hidden = true; $('#dataView').hidden = true; $('#usageView').hidden = true; $('#rulesView').hidden = false;
  view = 'rules'; window.scrollTo(0, 0);
}
function closeRules(force) { if (!force && !confirmLeave()) return; setPromptFs(false); setDirty(false); setView('biz'); lastJson = ''; refresh(); }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && view === 'rules' && !document.querySelector('dialog[open]')) closeRules();
});

// ---- Users table (admins and the super admin) ----
let usersList = [];
let ufilter = 'all';
const dateOnly = (t) => (t ? new Date(t).toLocaleDateString([], { dateStyle: 'medium' }) : '-');
const ago = (t) => {
  if (!t) return 'Never';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'Just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : dateOnly(t);
};

async function loadUsers() {
  try { usersList = await api('/admin/users'); } catch (err) {
    if (err.message !== 'unauthorized') $('#usersRows').replaceChildren(el('tr', { className: 'none' }, el('td', { colSpan: 6, textContent: err.message })));
    return;
  }
  renderUsers();
}

function renderUsers() {
  const pending = usersList.filter((u) => u.status === 'pending').length;
  $('#pendingBadge').hidden = !pending; $('#pendingBadge').textContent = pending;
  $('#ufPending').textContent = pending ? `Pending (${pending})` : 'Pending';
  $('#ucount').textContent = usersList.length;
  const q = $('#usearch').value.trim().toLowerCase();
  const shown = usersList.filter((u) => (ufilter === 'all' || u.status === ufilter) && (!q || u.name.toLowerCase().includes(q) || u.email.includes(q)));

  const DONE = { Approve: 'Account approved', Reject: 'Sign-up rejected', Disable: 'Account disabled', Enable: 'Account enabled', 'Make admin': 'Now an admin', 'Make user': 'Now a regular user', 'Reset password': 'Password reset', Delete: 'Account deleted' };
  const act = (label, cls, fn) => el('button', { type: 'button', className: cls, textContent: label, onclick: async (ev) => {
    ev.target.disabled = true;
    try { if ((await fn()) !== false) toast(DONE[label] || 'Done'); } catch (err) { toastErr(err.message); }
    loadUsers();
  } });
  const patch = (u, data) => () => api(`/admin/users/${u.id}`, { method: 'PATCH', body: JSON.stringify(data) });

  const rows = shown.map((u) => {
    const mine = u.id === me.id;
    const manageable = !mine && ((me.role === 'super_admin' && u.role !== 'super_admin') || (me.role === 'admin' && u.role === 'user'));
    const buttons = [];
    if (manageable) {
      if (u.status === 'pending') buttons.push(act('Approve', '', patch(u, { status: 'active' })), act('Reject', 'ghost', async () => {
        if (!confirm(`Reject ${u.email}?`)) return false;
        await api(`/admin/users/${u.id}`, { method: 'DELETE' });
      }));
      else if (u.status === 'active') buttons.push(act('Disable', 'ghost', patch(u, { status: 'disabled' })));
      else buttons.push(act('Enable', '', patch(u, { status: 'active' })));
      if (me.role === 'super_admin' && u.status !== 'pending') buttons.push(act(u.role === 'admin' ? 'Make user' : 'Make admin', 'alt', patch(u, { role: u.role === 'admin' ? 'user' : 'admin' })));
      if (u.status !== 'pending') {
        buttons.push(act('Reset password', 'alt', async () => {
          const pw = prompt(`New password for ${u.email} (10+ characters)`);
          if (!pw) return false;
          await api(`/admin/users/${u.id}/password`, { method: 'POST', body: JSON.stringify({ password: pw }) });
        }), act('Delete', 'ghost', async () => {
          if (!confirm(`Delete ${u.email}?`)) return false;
          await api(`/admin/users/${u.id}`, { method: 'DELETE' });
        }));
      }
    }
    return el('tr', {},
      el('td', {}, el('div', { className: 'usr' },
        el('span', { className: 'avatar', textContent: (u.name || '?').trim().charAt(0).toUpperCase() }),
        el('div', {}, el('b', { textContent: u.name + (mine ? ' (you)' : '') }), el('small', { textContent: u.email })))),
      el('td', {}, el('span', { className: `role ${u.role}`, textContent: u.role.replace('_', ' ') })),
      el('td', {}, el('span', { className: `st ${u.status}`, textContent: u.status })),
      el('td', { className: 'dim', textContent: dateOnly(u.created_at) }),
      el('td', { className: 'dim', textContent: ago(u.last_login_at) }),
      el('td', {}, el('div', { className: 'acts' }, ...buttons)));
  });
  $('#usersRows').replaceChildren(...(rows.length ? rows : [el('tr', { className: 'none' }, el('td', { colSpan: 6, textContent: 'No users match.' }))]));
}
document.querySelectorAll('.toolbar2 .f[data-uf]').forEach((b) => b.onclick = () => {
  ufilter = b.dataset.uf;
  document.querySelectorAll('.toolbar2 .f[data-uf]').forEach((x) => x.classList.toggle('on', x === b));
  renderUsers();
});
$('#usearch').oninput = renderUsers;

// Reconnect every business (one after another).
$('#restartAll').onclick = async () => {

// Short messages in the corner: type 'ok' (default) or 'err'. Click to dismiss.
function toast(text, type = 'ok') {
  const host = $('#toasts');
  try { if (!host.matches(':popover-open')) host.showPopover(); } catch { /* old browser: still visible */ }
  const t = el('div', { className: `toast ${type === 'err' ? 'err' : ''}`, textContent: text, role: type === 'err' ? 'alert' : 'status' });
  const close = () => { t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  t.onclick = close;
  host.append(t);
  while (host.children.length > 4) host.firstChild.remove();
  setTimeout(close, type === 'err' ? 6500 : 3200);
}
const toastErr = (m) => { if (m && m !== 'unauthorized') toast(m, 'err'); };

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach((k) => k != null && n.append(k));
  return n;
}

const fmt = (ms) => { const t = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

const PILL = {
  starting: 'Starting', requesting_code: 'Getting code', loading_qr: 'Getting QR', qr: 'Scan QR', code: 'Enter code',
  authenticated: 'Logging in', retrying: 'Retrying', restarting: 'Restarting', logging_out: 'Logging out',
  ready: 'Connected', auth_failure: 'Login failed', error: 'Error',
};

// What's happening right now, in plain words.
function stageText(s) {
  const forCode = s.phone ? ` for +${s.phone}` : '';
  switch (s.status) {
    case 'starting':
      if (s.progress && s.progress.percent > 0) return `Loading chats... ${s.progress.percent}%`;
      if (s.newLogin) return s.phone ? `Getting a new login code${forCode}...` : 'Getting a new QR code...';
      if (s.phone) return `Getting a login code${forCode}...`;
      return s.attempt > 1 ? `Connecting (try ${s.attempt} of 3)...` : 'Connecting...';
    case 'requesting_code': return `Requesting a login code${forCode}...`;
    case 'loading_qr': return 'Switching to a QR code...';
    case 'authenticated': return 'Linked. Finishing login...';
    case 'retrying': return 'Connection lost. Reconnecting...';
    case 'restarting': return 'Reconnecting...';
    case 'logging_out': return 'Logging out...';
    default: return '';
  }
}
const WORKING = ['starting', 'requesting_code', 'loading_qr', 'authenticated', 'retrying', 'restarting', 'logging_out'];
// Connecting normally takes a few seconds; only mention it after a while.
const SLOW_AFTER_MS = 45000;
const SLOW_STATES = ['starting', 'requesting_code', 'loading_qr', 'authenticated'];

async function restart(id, phone, btn) {
  if (btn) btn.disabled = true;
  try {
    await api(`/sessions/${encodeURIComponent(id)}/restart`, { method: 'POST', body: JSON.stringify(phone === undefined ? {} : { phone }) });
    delete pairDrafts[id]; refresh();
  } catch (err) { toastErr(err.message); if (btn) btn.disabled = false; }
}

// ---- Dropdown component ----
// One popup used everywhere: provider, model, filters, status, contacts. It is drawn on the page
// (not inside the field), so tables and panels never clip it.
function makePopup({ anchor, getItems, onPick, search = false, getQuery = () => '', minWidth = 200 }) {
  let box = null, sbox = null, listEl = null, shown = [], active = -2;
  const isOpen = () => Boolean(box);
  const wantsSearch = () => (typeof search === 'function' ? search() : search);

  function place() {
    if (!box) return;
    const r = anchor.getBoundingClientRect();
    const w = Math.max(r.width, minWidth);
    box.style.minWidth = `${w}px`;
    box.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
    const below = innerHeight - r.bottom, h = Math.min(box.offsetHeight || 280, 320);
    if (below < h + 12 && r.top > below) { box.style.top = 'auto'; box.style.bottom = `${innerHeight - r.top + 4}px`; }
    else { box.style.bottom = 'auto'; box.style.top = `${r.bottom + 4}px`; }
  }
  function draw(resetActive) {
    if (!box) return;
    const q = (sbox ? sbox.value : getQuery()).trim().toLowerCase();
    const { items, note } = getItems(q);
    shown = items;
    if (resetActive) active = 0;
    if (active === -2) active = Math.max(0, shown.findIndex((i) => i.selected));
    if (active >= shown.length) active = shown.length - 1;
    const rows = shown.map((it, i) => {
      const row = el('div', { className: 'combo-item' + (i === active ? ' on' : '') });
      if (it.avatar != null) row.append(el('span', { className: 'avatar', textContent: it.avatar }));
      row.append(el('div', { className: 'ci' }, el('b', { textContent: it.title }), it.sub ? el('small', { textContent: it.sub }) : null));
      if (it.right) row.append(el('span', { className: 'ct', textContent: it.right }));
      if (it.selected) row.append(el('span', { className: 'ck', textContent: '✓' }));
      row.onmousedown = (e) => { e.preventDefault(); pick(it); };
      return row;
    });
    listEl.replaceChildren(...rows, ...(note ? [el('div', { className: 'combo-empty', textContent: note })] : []));
    box.querySelector('.combo-item.on')?.scrollIntoView({ block: 'nearest' });
    place();
  }
  function pick(it) { close(); onPick(it); }
  const outside = (e) => { if (box && !box.contains(e.target) && !anchor.contains(e.target)) close(); };
  function keydown(e) { if (key(e)) e.preventDefault(); }
  function open() {
    if (box) return;
    box = el('div', { className: 'combo-list' });
    listEl = el('div', { className: 'pop-items' });
    if (wantsSearch()) {
      sbox = el('input', { className: 'pop-search', placeholder: 'Search...', autocomplete: 'off', spellcheck: false });
      sbox.oninput = () => draw(true); sbox.onkeydown = keydown;
      box.append(sbox);
    }
    box.append(listEl);
    (anchor.closest('dialog') || document.body).append(box);
    active = -2; draw();
    sbox?.focus();
    document.addEventListener('mousedown', outside, true);
    addEventListener('resize', place); addEventListener('scroll', place, true);
    anchor.setAttribute?.('aria-expanded', 'true');
  }
  function close() {
    if (!box) return;
    box.remove(); box = null; sbox = null;
    document.removeEventListener('mousedown', outside, true);
    removeEventListener('resize', place); removeEventListener('scroll', place, true);
    anchor.removeAttribute?.('aria-expanded');
  }
  // Returns true when it used the key.
  function key(e) {
    if (!box) { if (e.key === 'ArrowDown') { open(); return true; } return false; }
    if (e.key === 'ArrowDown') { active = Math.min(active + 1, shown.length - 1); draw(); return true; }
    if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); draw(); return true; }
    if (e.key === 'Enter' && shown[active]) { pick(shown[active]); return true; }
    if (e.key === 'Escape') { e.stopPropagation(); close(); return true; }
    return false;
  }
  return { open, close, isOpen, key, redraw: () => draw(true) };
}

// Turns a <select> into a dropdown. The <select> stays in the page (hidden), so existing code that
// reads .value or listens for "change" keeps working. Pass a detached <select> and insert the result.
function enhanceSelect(sel, { inline = false, small = false } = {}) {
  if (sel._dd) return sel._dd;
  const protoValue = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  const label = el('span', { className: 'dd-label' });
  const btn = el('button', { type: 'button', className: 'dd' + (small ? ' sm' : '') }, label, el('span', { className: 'dd-caret', textContent: '⌄' }));
  const wrap = el('span', { className: 'ddwrap' + (inline ? ' auto' : '') });
  const refresh = () => {
    const o = sel.options[sel.selectedIndex];
    label.textContent = o ? o.textContent : 'Select...'; label.classList.toggle('dim', !o);
    btn.disabled = sel.disabled;
  };
  Object.defineProperty(sel, 'value', { get() { return protoValue.get.call(this); }, set(v) { protoValue.set.call(this, v); refresh(); }, configurable: true });
  const pop = makePopup({
    anchor: btn, minWidth: 180, search: () => sel.options.length > 7,
    getItems: (q) => {
      const items = [...sel.options].filter((o) => !q || o.textContent.toLowerCase().includes(q)).map((o) => ({ title: o.textContent, value: o.value, selected: o.value === sel.value }));
      return { items, note: items.length ? '' : 'No matches' };
    },
    onPick: (it) => { sel.value = it.value; sel.dispatchEvent(new Event('change', { bubbles: true })); btn.focus(); },
  });
  btn.onclick = () => (pop.isOpen() ? pop.close() : pop.open());
  btn.onkeydown = (e) => { if (pop.key(e)) e.preventDefault(); else if (e.key === ' ' && !pop.isOpen()) { e.preventDefault(); pop.open(); } };
  new MutationObserver(refresh).observe(sel, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled'] });
  if (sel.parentNode) sel.replaceWith(wrap);
  wrap.append(sel, btn);
  refresh();
  sel._dd = wrap;
  return wrap;
}

// A text field with a suggestion dropdown (replaces <datalist>). You can still type anything.
function enhanceDatalistInput(input) {
  const dl = document.getElementById(input.getAttribute('list'));
  input.removeAttribute('list');
  let typed = false;
  const pop = makePopup({
    anchor: input, minWidth: 240, getQuery: () => (typed ? input.value : ''),
    getItems: (q) => {
      const items = [...dl.options].filter((o) => !q || o.value.toLowerCase().includes(q)).map((o) => ({ title: o.value, selected: o.value === input.value }));
      return { items, note: items.length ? '' : 'Custom value' };
    },
    onPick: (it) => { input.value = it.value; input.dispatchEvent(new Event('input', { bubbles: true })); },
  });
  const show = () => { typed = false; pop.open(); };
  input.addEventListener('focus', show);
  input.addEventListener('click', () => { if (!pop.isOpen()) show(); });
  input.addEventListener('input', () => { typed = true; if (pop.isOpen()) pop.redraw(); else pop.open(); });
  input.addEventListener('keydown', (e) => { if (pop.key(e)) e.preventDefault(); });
  input.addEventListener('blur', () => pop.close());
}

// ---- Contacts ----
const contactCache = {}; // business -> { at, list }
async function loadSendContacts(id) {
  const hit = contactCache[id];
  if (hit && Date.now() - hit.at < 60000) return hit.list;
  const list = await api(`/sessions/${encodeURIComponent(id)}/contacts?for=send`);
  contactCache[id] = { at: Date.now(), list };
  return list;
}
const ago2 = (t) => {
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 60 ? `${Math.max(1, m)}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;
};
const digitsOf = (t) => t.replace(/[\s+()-]/g, '');
const contactItem = (c) => ({ avatar: (c.name || '?').charAt(0).toUpperCase(), title: c.name, sub: c.isGroup ? 'Group' : c.number ? `+${c.number}` : 'Number hidden', right: ago2(c.lastMessageAt), contact: c });
const matches = (c, q) => { const qd = digitsOf(q); return !q || c.name.toLowerCase().includes(q) || Boolean(c.number && qd && c.number.includes(qd)); };

// The "Send to" box: pick a contact or group, or type a number.
// d = { to, label }: what gets sent (a number or group name) and what the box shows.
function contactCombo(s, d) {
  const input = el('input', { placeholder: 'Search a contact or group, or type a number', value: d.label || d.to || '', required: true, autocomplete: 'off', spellcheck: false });
  const wrap = el('div', { className: 'combo' }, input, el('span', { className: 'combo-caret', textContent: '⌄' }));
  let contacts = null, loadErr = '', typed = false;
  const pop = makePopup({
    anchor: wrap, minWidth: 280, getQuery: () => (typed ? input.value : ''),
    getItems: (q) => {
      const qd = digitsOf(q);
      const hits = (contacts || []).filter((c) => matches(c, q));
      const items = hits.slice(0, 60).map(contactItem);
      if (/^\d{6,15}$/.test(qd) && !hits.some((c) => c.number === qd)) items.unshift({ avatar: '+', title: `Send to +${qd}`, sub: 'New number', number: qd });
      const note = contacts === null && !loadErr ? 'Loading contacts...' : loadErr || (items.length ? '' : 'No match. Type a full number to send to a new contact.');
      return { items, note };
    },
    onPick: (it) => {
      if (it.number) { d.to = it.number; d.label = `+${it.number}`; } else { d.to = it.contact.number || it.contact.name; d.label = it.contact.name; }
      input.value = d.label;
    },
  });
  async function open() {
    typed = false; pop.open();
    if (contacts === null && !loadErr) {
      try { contacts = await loadSendContacts(s.id); } catch (err) { loadErr = err.message; }
      pop.redraw();
    }
  }
  input.onfocus = () => { input.select(); open(); };
  input.onclick = () => { if (!pop.isOpen()) open(); };
  input.onblur = () => pop.close();
  input.oninput = () => { d.to = input.value; d.label = ''; typed = true; if (pop.isOpen()) pop.redraw(); else pop.open(); };
  input.onkeydown = (e) => { if (pop.key(e)) e.preventDefault(); };
  return wrap;
}

// A phone-number field that suggests this business's contacts (people only). Typing a number still works.
function attachNumberPicker(input, getBusiness) {
  let contacts = null, failed = false, typed = false;
  const pop = makePopup({
    anchor: input, minWidth: 260, getQuery: () => (typed ? input.value : ''),
    getItems: (q) => {
      const items = (contacts || []).filter((c) => !c.isGroup && c.number && matches(c, q)).slice(0, 60).map((c) => ({ ...contactItem(c), value: c.number }));
      return { items, note: contacts === null && !failed ? 'Loading contacts...' : items.length ? '' : failed ? 'Contacts appear once this number is connected. Type a number.' : 'No match. Type a full number.' };
    },
    onPick: (it) => { input.value = it.value; input.dispatchEvent(new Event('input', { bubbles: true })); },
  });
  async function open() {
    typed = false; pop.open();
    if (contacts === null) {
      failed = false;
      try { contacts = await loadSendContacts(getBusiness()); } catch { failed = true; contacts = []; }
      pop.redraw();
      if (failed) contacts = null; // try again next time
    }
  }
  input.addEventListener('focus', open);
  input.addEventListener('click', () => { if (!pop.isOpen()) open(); });
  input.addEventListener('input', () => { typed = true; if (pop.isOpen()) pop.redraw(); else pop.open(); });
  input.addEventListener('keydown', (e) => { if (pop.key(e)) e.preventDefault(); });
  input.addEventListener('blur', () => pop.close());
}

// ---- Share the QR code ----
// The QR is only valid for about a minute, so it is shared as an image, never as a public link.
const QR_TEXT = (id) => `Link WhatsApp for "${id}": open WhatsApp > Linked devices > Link a device, then scan this QR code. It expires in about a minute.`;
async function qrFile(s) {
  const blob = await (await fetch(s.qr)).blob();
  return new File([blob], `${s.id}-whatsapp-qr.png`, { type: 'image/png' });
}
function downloadFile(file) {
  const a = el('a', { href: URL.createObjectURL(file), download: file.name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// Opens the phone / OS share sheet when the browser has one, otherwise downloads the image.
async function shareQr(s, btn) {
  const label = btn.textContent; btn.disabled = true;
  try {
    const file = await qrFile(s);
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: `Link WhatsApp: ${s.id}`, text: QR_TEXT(s.id) }); btn.textContent = 'Shared'; toast('QR code shared'); }
      catch (e) { if (e.name !== 'AbortError') { downloadFile(file); btn.textContent = 'Saved image'; toast('QR code saved as an image'); } }
    } else { downloadFile(file); btn.textContent = 'Saved image'; toast('QR code saved as an image'); }
  } catch (err) { toastErr(`Could not share the QR code: ${err.message}`); }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 1800);
}
async function copyQr(s, btn) {
  const label = btn.textContent; btn.disabled = true;
  try {
    const file = await qrFile(s);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': file })]);
    btn.textContent = 'Copied'; toast('QR image copied');
  } catch { btn.textContent = 'Copy not supported'; }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 1800);
}

// Everything about linking and keeping WhatsApp connected: lives on the business page, "Connection" tab.
function connection(s) {
  const c = el('div', { className: 'conn' });

  if (s.me) c.append(el('div', { className: 'meta', textContent: `${s.me.name || ''} +${s.me.number}` }));

  // Progress while connecting: what's happening, how long it's taken, and auto-restart countdown.
  if (WORKING.includes(s.status)) {
    const pct = s.status === 'starting' && s.progress ? s.progress.percent : null;
    const bar = el('div', { className: 'progress' + (pct ? '' : ' busy') }, el('div', { style: pct ? `width:${pct}%` : '' }));
    const elapsed = el('span', { className: 'tick-elapsed' });
    elapsed.dataset.since = s.since;
    c.append(el('div', { className: 'stage' }, el('div', { className: 'line' }, el('span', { textContent: stageText(s) }), elapsed), bar));

    // Only if it's really slow: a calm note, the automatic restart time, and a small manual option.
    // Not right after a logout: the card is just fetching a new QR code.
    if (SLOW_STATES.includes(s.status) && !s.newLogin) {
      const slow = el('div', { className: 'slow tick-slow', hidden: true });
      slow.dataset.since = s.since;
      if (s.deadline) slow.dataset.deadline = s.deadline;
      const countdown = el('span', { className: 'tick-countdown' });
      const now = el('button', { type: 'button', className: 'link', textContent: 'Restart now' });
      now.onclick = () => restart(s.id, undefined, now);
      slow.append(el('span', {}, countdown, ' '), now);
      c.append(slow);
    }

    // While getting a code, offer the QR instead.
    if (s.phone && ['starting', 'requesting_code'].includes(s.status)) {
      const qrBtn = el('button', { className: 'link', type: 'button', textContent: 'Use QR code instead' });
      qrBtn.onclick = () => restart(s.id, null, qrBtn);
      c.append(qrBtn);
    }
  }

  if (s.error && s.status !== 'ready') c.append(el('div', { className: 'msg err', textContent: s.error }));
  if (s.status === 'error' || s.status === 'auth_failure') {
    const retry = el('button', { className: 'alt', textContent: 'Retry' });
    retry.onclick = () => restart(s.id, undefined, retry);
    c.append(retry);
    if (s.phone) {
      const qrBtn = el('button', { className: 'link', type: 'button', textContent: 'Use QR code instead' });
      qrBtn.onclick = () => restart(s.id, null, qrBtn);
      c.append(qrBtn);
    }
  }

  if (s.status === 'qr' && s.qr) {
    c.append(el('div', { className: 'qr' },
      el('img', { src: s.qr, alt: 'WhatsApp QR code' }),
      el('p', { textContent: 'WhatsApp > Linked devices > Link a device' })));
    const share = el('button', { type: 'button', textContent: 'Share QR code' }); share.onclick = () => shareQr(s, share);
    const copy = el('button', { type: 'button', className: 'alt', textContent: 'Copy image' }); copy.onclick = () => copyQr(s, copy);
    c.append(el('div', { className: 'row' }, share, copy));
    const pd = pairDrafts[s.id] || (pairDrafts[s.id] = { phone: '' });
    const phone = el('input', { placeholder: 'Or link with phone number, e.g. 923001234567', value: pd.phone, inputMode: 'tel', required: true, oninput: (e) => pd.phone = e.target.value });
    const go = el('button', { textContent: 'Get code' });
    const f = el('form', { className: 'row' }, phone, go);
    f.onsubmit = (e) => { e.preventDefault(); restart(s.id, pd.phone, go); };
    c.append(f);
  }

  if (s.status === 'code' && s.code) {
    c.append(el('div', { className: 'code' },
      el('div', { className: 'meta', textContent: `Code for +${s.phone}` }),
      el('b', { textContent: s.code }),
      el('ol', {},
        el('li', { textContent: 'On that phone, open WhatsApp > Linked devices > Link a device' }),
        el('li', { textContent: 'Tap "Link with phone number instead"' }),
        el('li', { textContent: 'Enter the code above. It changes every few minutes and only the newest one works, so if it changes here, use the new one.' }))));
    const qrBtn = el('button', { className: 'link', type: 'button', textContent: 'Use QR code instead' });
    qrBtn.onclick = () => restart(s.id, null, qrBtn);
    c.append(qrBtn);
  }

  // Always-visible full restart while not connected: reload the QR / code, or unstick a
  // slow or failed start. Connects to WhatsApp again from scratch (a saved login is kept).
  const RELOAD_LABEL = { qr: 'Reload QR code', loading_qr: 'Reload QR code', code: 'Get a new code', requesting_code: 'Get a new code' };
  if (s.status !== 'ready' && !['logging_out', 'restarting'].includes(s.status)) {
    const label = RELOAD_LABEL[s.status] || (s.newLogin ? 'Reload QR code' : 'Reconnect');
    const reload = el('button', { className: 'alt', type: 'button', textContent: label });
    reload.onclick = async () => {
      reload.disabled = true; reload.textContent = 'Restarting...';
      try { await api(`/sessions/${encodeURIComponent(s.id)}/hard-restart`, { method: 'POST' }); lastJson = ''; refresh(); }
      catch (err) { toastErr(err.message); reload.disabled = false; reload.textContent = label; }
    };
    c.append(el('div', { className: 'row' }, reload));
  }

  if (s.status === 'ready') {
    const d = drafts[s.id] || (drafts[s.id] = { to: '', message: '' });
    const to = contactCombo(s, d);
    const message = el('input', { placeholder: 'Message', value: d.message, required: true, oninput: (e) => d.message = e.target.value });
    const out = el('div', { className: 'msg' });
    const btn = el('button', { textContent: 'Send' });
    const f = el('form', { className: 'send' }, to, message, btn, out);
    f.onsubmit = async (e) => {
      e.preventDefault(); btn.disabled = true; out.className = 'msg'; out.textContent = 'Sending...';
      try {
        const r = await api(`/sessions/${encodeURIComponent(s.id)}/send`, { method: 'POST', body: JSON.stringify({ to: d.to, message: d.message }) });
        out.className = r.delivered === false ? 'msg err' : 'msg ok'; out.textContent = r.delivered === false ? `Handed to WhatsApp, but ${r.sentTo} hasn't got it yet (${r.status}). Check the phone.` : `Sent to ${r.sentTo}${r.status ? ` (${r.status})` : ''}`; d.message = ''; message.value = ''; if (r.delivered !== false) toast(`Message sent to ${r.sentTo}`);
      } catch (err) { out.className = 'msg err'; out.textContent = err.message; }
      btn.disabled = false;
    };
    c.append(f);
  }

  // Connection health (checked every minute on the server) and a reconnect button.
  if (s.status === 'ready') {
    const w = s.web;
    const hard = el('button', { className: 'alt', type: 'button', textContent: 'Reconnect' });
    hard.onclick = async () => {
      if (!confirm(`Reconnect "${s.id}"?`)) return;
      hard.disabled = true;
      try { await api(`/sessions/${encodeURIComponent(s.id)}/hard-restart`, { method: 'POST' }); lastJson = ''; refresh(); toast(`Reconnecting "${s.id}"`); }
      catch (err) { toastErr(err.message); hard.disabled = false; }
    };
    const details = w ? [w.chats != null ? `${w.chats} chats loaded` : null, w.ms != null ? `answered in ${w.ms < 1000 ? `${w.ms} ms` : `${(w.ms / 1000).toFixed(1)} s`}` : null].filter(Boolean).join(' · ') : '';
    const webRow = el('div', { className: `web ${w ? w.level : ''}` },
      el('span', { className: 'dot' }),
      el('span', { className: 'txt' }, `WhatsApp: ${w ? w.text : 'checking...'}`,
        el('span', { className: 'sub' }, details ? `${details} · ` : '', w?.checkedAt ? Object.assign(el('span', { className: 'tick-ago' }), { textContent: 'checked just now' }) : 'first check in a few seconds')),
      hard);
    webRow.querySelector('.tick-ago')?.setAttribute('data-at', w.checkedAt);
    c.append(webRow);
  }

  // Log out: the card stays and shows a new QR. Delete business: the only way a card goes.
  if (s.status === 'ready') {
    const logout = el('button', { className: 'ghost', textContent: 'Log out' });
    logout.onclick = async () => {
      if (!confirm(`Log out "${s.id}"?`)) return;
      logout.disabled = true;
      try { await api(`/sessions/${encodeURIComponent(s.id)}/logout`, { method: 'POST' }); lastJson = ''; refresh(); toast(`Logged out "${s.id}"`); }
      catch (err) { toastErr(err.message); logout.disabled = false; }
    };
    c.append(el('div', { className: 'row' }, logout));
  }
  const wipe = el('button', { className: 'link danger', type: 'button', textContent: 'Delete business and all its data' });
  wipe.onclick = async () => {
    if (!confirm(`Delete "${s.id}" and all its data? This can't be undone.`)) return;
    wipe.disabled = true;
    try { await api(`/sessions/${encodeURIComponent(s.id)}`, { method: 'DELETE' }); delete drafts[s.id]; if (view === 'rules') closeRules(true); else refresh(); toast(`Deleted "${s.id}"`); }
    catch (err) { toastErr(err.message); wipe.disabled = false; }
  };
  c.append(wipe);
  return c;
}

// Every second: update elapsed timers and the "taking longer than usual" countdowns.
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('.tick-ago').forEach((n) => { const sec = Math.max(0, Math.round((now - Number(n.dataset.at)) / 1000)); n.textContent = `checked ${sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m`} ago`; });
  document.querySelectorAll('.tick-elapsed').forEach((n) => { n.textContent = fmt(now - Number(n.dataset.since)); });
  document.querySelectorAll('.tick-slow').forEach((n) => {
    n.hidden = now - Number(n.dataset.since) < SLOW_AFTER_MS;
    const cd = n.querySelector('.tick-countdown');
    const left = Number(n.dataset.deadline || 0) - now;
    cd.textContent = !n.dataset.deadline ? 'Taking longer than usual.' : left > 0 ? `Taking longer than usual. Restarts in ${fmt(left)}.` : 'Restarting...';
  });
}, 1000);

async function refresh() {
  let list;

let whoSelected = new Map(); // chat id -> name

function showWho() {
  const mode = whoMode();
  $('#whoPicker').style.display = mode === 'all' ? 'none' : 'flex';
  if (mode !== 'all' && !whoChats) loadWho();
  renderWho();

async function loadWho() {
  $('#whoList').replaceChildren(el('div', { className: 'hint', textContent: 'Loading chats...' }));
  try { whoChats = await api(`/sessions/${encodeURIComponent(rulesFor)}/contacts`); }
  catch (err) { whoChats = []; $('#whoList').replaceChildren(el('div', { className: 'msg err', textContent: err.message })); }
  renderWho();
}

function renderWho() {
  const mode = whoMode();
  const n = whoSelected.size;
  $('#whoCount').textContent = mode === 'only' ? `${n} selected` : `${n} excluded`;
  if (!whoChats) return;
  const q = $('#whoSearch').value.trim().toLowerCase();
  const recentIds = new Set(whoChats.map((c) => c.id));
  // Contacts picked earlier whose last chat is older than 2 weeks stay listed so they can be unticked.
  const older = [...whoSelected].filter(([id]) => !recentIds.has(id)).map(([id, name]) => ({ id, name, number: (/^(\d+)@c\.us$/.exec(id) || [])[1], older: true }));
  const rows = [...older, ...whoChats].filter((c) => !q || `${c.name} ${c.number || ''}`.toLowerCase().includes(q));
  if (!rows.length) {
    $('#whoList').replaceChildren(el('div', { className: 'hint', textContent: q ? 'No chats match.' : 'No chats in the last 2 weeks.' }));
    return;
  }
  $('#whoList').replaceChildren(...rows.map((c) => {
    const box = el('input', { type: 'checkbox', checked: whoSelected.has(c.id) });
    box.onchange = () => { box.checked ? whoSelected.set(c.id, c.name) : whoSelected.delete(c.id); renderWho(); };
    const sub = c.older ? 'selected earlier' : c.lastMessageAt ? new Date(c.lastMessageAt).toLocaleDateString([], { day: 'numeric', month: 'short' }) : '';
    return el('label', {}, box,
      el('span', { className: 'nm' }, c.name || 'Unknown', c.number && c.number !== c.name ? el('span', { className: 'sub', textContent: `  +${c.number}` }) : null),
      el('span', { className: 'sub', textContent: sub }));
  }));
}

// Opens a row's details below it. Keeps its state when the table refreshes.
function pair(key, cols, cells, detail) {
  const tr = el('tr', { className: detail ? 'has-more' : '' }, ...cells);
  if (!detail) return [tr];
  const more = el('tr', { className: 'expand', hidden: !expanded.has(key) }, el('td', { colSpan: cols }, detail));
  tr.onclick = (e) => {
    if (e.target.closest('button, select, input, textarea, a')) return;
    more.hidden = !more.hidden;
    if (more.hidden) expanded.delete(key); else expanded.add(key);
  };
  tr.toggle = () => tr.click();
  return [tr, more];
}

let dvLoadId = 0;
async function loadData(silent) {
  const kind = dvKind, cfg = PAGES[kind], mine = ++dvLoadId;
  if (!silent) $('#dvBody').replaceChildren(el('tr', { className: 'none' }, el('td', { colSpan: cfg.head.length, textContent: 'Loading...' })));
  let targets = dvBizSel === 'all' ? lastList.map((b) => b.id) : [dvBizSel];
  if (kind === 'logs' && dvBizSel === 'all' && isAdminUser()) targets.push('__server');
  const errors = [];
  const extra = kind === 'logs' ? `?limit=200${dvFilter === 'error' ? '&level=error' : ''}${$('#dvAll').checked && isAdminUser() ? '&all=1' : ''}` : '';
  const results = await Promise.all(targets.map(async (id) => {
    try { return (await api(cfg.path(id) + extra)).map((r) => ({ ...r, _biz: id })); }
    catch (err) { if (err.message !== 'unauthorized') errors.push(`${id}: ${err.message}`); return []; }
  }));
  if (mine !== dvLoadId || kind !== dvKind) return; // a newer load or another page took over
  dvRows = results.flat().sort(cfg.sort).slice(0, 600);
  $('#dvNote').textContent = errors.join(' · ');
  renderData();
}

function renderData() {
  const cfg = PAGES[dvKind];
  const q = $('#dvSearch').value.trim().toLowerCase();
  const shown = dvRows.filter((r) => cfg.match(r, dvFilter) && (!q || cfg.text(r).toLowerCase().includes(q)));
  $('#dvCount').textContent = shown.length;
  if (dvKind === 'questions') { // count on the "Waiting" filter
    const waiting = dvRows.filter((r) => r.status === 'open').length;
    const b = document.querySelector('#dvFilters .f[data-f=open]'); if (b) b.textContent = waiting ? `Waiting (${waiting})` : 'Waiting';
  }
  const rows = shown.flatMap((r) => cfg.row(r));
  const none = el('tr', { className: 'none' }, el('td', { colSpan: cfg.head.length, textContent: dvRows.length ? 'Nothing matches.' : cfg.empty }));
  $('#dvBody').replaceChildren(...(rows.length ? rows : [none]));
}

    out.textContent = polish.checked ? 'Sending...' : 'Sending...';
    try {

  return el('div', { className: 'answer' },
    el('b', { textContent: 'Your answer' }),

    el('label', { className: 'check small' }, polish, 'Polish with AI'),
    el('div', { className: 'row' }, btn),
    out);
}

// AI usage report: one panel, used on the Usage page (all businesses, by user) and on each business's Usage tab.
// ---------------------------------------------------------------------------
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const compact = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(n >= 1e4 ? 0 : 1)}K` : String(Math.round(n)));
const usd = (n) => (n == null ? '-' : n === 0 ? '$0' : n < 1 ? `$${n.toFixed(4)}` : `$${n.toFixed(2)}`);
const dur = (n) => (n < 1000 ? `${Math.round(n)} ms` : `${(n / 1000).toFixed(1)} s`);
const KIND_LABEL = { reply: 'Customer replies', profile: 'Customer profiles', voice: 'Voice notes', test: 'Test replies' };
const allTokens = (r) => (r.input || 0) + (r.output || 0) + (r.cacheRead || 0) + (r.cacheWrite || 0);
const hasCost = (r) => (r.costed || 0) > 0;
const SVGNS = 'http://www.w3.org/2000/svg';

// business: fix the panel to one business (the business tab). businessSelect: let the user pick one.
// byBusiness / byUser: which breakdown tables to show. onData: called with each response.
function usagePanel({ business = null, businessSelect = false, byBusiness = false, byUser = false, onData = null } = {}) {
  const st = { days: 30, metric: 'requests', data: null, biz: business || 'all' };
  const root = el('div', { className: 'usagepanel' });
  const rangeBtns = [[1, '24 hours'], [7, '7 days'], [30, '30 days'], [90, '90 days']].map(([d, label]) => {
    const b = el('button', { type: 'button', className: 'f' + (d === st.days ? ' on' : ''), textContent: label });
    b.onclick = () => { st.days = d; rangeBtns.forEach((x) => x.classList.toggle('on', x === b)); load(); };
    return b;
  });
  const bizSel = businessSelect ? el('select') : null;
  const bizDd = bizSel ? enhanceSelect(bizSel, { inline: true }) : null;
  if (bizSel) bizSel.onchange = () => { st.biz = bizSel.value; load(); };
  const setup = el('div', { className: 'msg err' });
  const kpis = el('div', { className: 'rv-cards kpis' });
  const chartEl = el('div', { className: 'uchart' });
  const legend = el('div', { className: 'legend' });
  const metricBtns = [['requests', 'Requests'], ['tokens', 'Tokens'], ['cost', 'Cost']].map(([m, label]) => {
    const b = el('button', { type: 'button', className: m === st.metric ? 'on' : '', textContent: label });
    b.onclick = () => { st.metric = m; metricBtns.forEach((x) => x.classList.toggle('on', x === b)); if (st.data) drawChart(); };
    return b;
  });
  const tables = el('div', { className: 'u-grid' });
  const recentBody = el('tbody');
  root.append(
    el('div', { className: 'toolbar2' }, ...rangeBtns, el('span', { className: 'grow' }), bizDd),
    setup, kpis,
    el('div', { className: 'upanel' }, el('div', { className: 'uhead' }, el('h3', { textContent: 'Over time' }), el('div', { className: 'seg' }, ...metricBtns)), chartEl, legend),
    tables,
    el('div', { className: 'upanel' }, el('div', { className: 'uhead' }, el('h3', { textContent: 'Recent requests' })),
      el('div', { className: 'tablewrap' }, el('table', { className: 'tbl' },
        el('thead', {}, el('tr', {}, ...['Time', 'Business', 'Type', 'Model', 'Tokens', 'Time taken', 'Result'].map((h) => el('th', { textContent: h })))), recentBody))));

  function refreshBusinesses() {
    if (!bizSel) return;
    const ids = lastList.map((b) => b.id);
    if (st.biz !== 'all' && !ids.includes(st.biz)) st.biz = 'all';
    bizSel.replaceChildren(...[['all', ids.length > 1 ? 'All businesses' : 'Business'], ...ids.map((i) => [i, i])].map(([v, t]) => el('option', { value: v, textContent: t, selected: v === st.biz })));
  }
  const query = () => `days=${st.days}&business=${encodeURIComponent(st.biz)}`;

  async function load() {
    try { st.data = await api(`/usage?${query()}&tz=${encodeURIComponent(TZ)}`); }
    catch (err) { if (err.message !== 'unauthorized') setup.textContent = err.message; return; }
    if (onData) onData(st.data);
    render();
  }
  async function exportCsv() {
    const res = await fetch(`/api/usage/export?${query()}`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const a = el('a', { href: URL.createObjectURL(await res.blob()), download: `ai-usage${st.biz !== 'all' ? `-${st.biz}` : ''}-last-${st.days}-days.csv` });
    document.body.append(a); a.click(); a.remove();
  }

  function render() {
    const d = st.data, t = d.totals || { requests: 0, ok: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0, ms: 0, cost: 0, costed: 0 };
    const c = d.config || {};
    setup.textContent = c.aiReady ? '' : `AI is not set up on this server (missing ${c.aiEnvKey}).`;
    const failed = t.requests - t.ok;
    const card = (l, v, sub) => el('div', { className: 'rv-card' }, el('div', { className: 'l', textContent: l }), el('div', { className: 'v', textContent: v }), sub ? el('div', { className: 's', textContent: sub }) : null);
    const costSub = !c.pricesSet && !hasCost(t) ? 'Set AI_PRICE_* in env' : t.costed < t.requests ? `${t.costed}/${t.requests} priced` : 'Estimated, USD';
    kpis.replaceChildren(
      card('Requests', t.requests.toLocaleString(), failed ? `${failed} failed` : 'None failed'),
      card('Input tokens', compact(t.input + t.cacheRead + t.cacheWrite), t.cacheRead ? `${compact(t.cacheRead)} from cache` : ''),
      card('Output tokens', compact(t.output), ''),
      card('Estimated cost', hasCost(t) ? usd(t.cost) : 'Not set', costSub),
      card('Avg response', t.requests ? dur(t.ms / t.requests) : '-', ''),
      card('Success rate', t.requests ? `${Math.round((t.ok / t.requests) * 1000) / 10}%` : '-', ''));
    drawChart();

    const num = (v) => el('td', { className: 'num', textContent: v });
    const table = (title, head, rows) => el('div', { className: 'upanel' }, el('div', { className: 'uhead' }, el('h3', { textContent: title })),
      el('div', { className: 'tablewrap' }, el('table', { className: 'tbl' },
        el('thead', {}, el('tr', {}, ...head.map((h, i) => el('th', { className: i ? 'num' : '', textContent: h })))),
        el('tbody', {}, ...(rows.length ? rows : [el('tr', { className: 'none' }, el('td', { colSpan: head.length, textContent: 'No requests in this period.' }))])))));
    const stats = (r) => [num(r.requests.toLocaleString()), num(compact(allTokens(r))), num(hasCost(r) ? usd(r.cost) : '-'), num(String(r.requests - r.ok)), num(r.requests ? dur(r.ms / r.requests) : '-')];
    const row = (label, r) => el('tr', {}, el('td', { textContent: label }), ...stats(r));
    const head = (first) => [first, 'Requests', 'Tokens', 'Cost', 'Failed', 'Avg time'];
    const blocks = [];
    if (byUser) blocks.push(table('By user', ['User', 'Businesses', 'Requests', 'Tokens', 'Cost', 'Failed', 'Avg time'], (d.byUser || []).map((r) => el('tr', {},
      el('td', {}, el('div', { className: 'two' }, el('b', { textContent: r.name }), r.email ? el('small', { textContent: r.email }) : null)),
      num(String(r.businesses.length)), ...stats(r)))));
    if (byBusiness) blocks.push(table('By business', head('Business'), d.byBusiness.map((r) => row(r._id || '(none)', r))));
    blocks.push(table('By type', head('Type'), d.byKind.map((r) => row(KIND_LABEL[r._id] || r._id, r))));
    blocks.push(table('By model', head('Model'), d.byModel.map((r) => row(r._id.model || '?', r))));
    tables.replaceChildren(...blocks);

    const rows = d.recent.map((r) => el('tr', {},
      el('td', { className: 'dim', textContent: when(r.at) }), el('td', { textContent: r.business || '-' }), el('td', { textContent: KIND_LABEL[r.kind] || r.kind }),
      el('td', { className: 'dim', textContent: r.model }),
      el('td', { className: 'dim', textContent: `${compact((r.input_tokens || 0) + (r.cache_read_tokens || 0) + (r.cache_write_tokens || 0))} in · ${compact(r.output_tokens || 0)} out` }),
      el('td', { className: 'dim', textContent: dur(r.ms || 0) }),
      el('td', {}, el('span', { className: 'pill ' + (r.ok ? 'ready' : 'error'), textContent: r.ok ? 'OK' : 'Failed' }), r.ok ? null : el('span', { className: 'err-sub', textContent: r.error || '' }))));
    recentBody.replaceChildren(...(rows.length ? rows : [el('tr', { className: 'none' }, el('td', { colSpan: 7, textContent: 'No requests in this period.' }))]));
  }

  // Bars per day. requests: ok + failed; tokens: input + output; cost: one colour.
  function drawChart() {
    const d = st.data, W = 900, H = 200, L = 40, B = 22, T = 8;
    const byDay = new Map(d.daily.map((r) => [r._id, r]));
    const days = [];
    for (let i = st.days - 1; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toLocaleDateString('en-CA', { timeZone: TZ }));
    const series = {
      requests: (r) => [{ v: r.ok || 0, color: 'var(--text)' }, { v: (r.requests || 0) - (r.ok || 0), color: 'var(--bad)' }],
      tokens: (r) => [{ v: (r.input || 0) + (r.cacheRead || 0) + (r.cacheWrite || 0), color: 'var(--text-2)' }, { v: r.output || 0, color: 'var(--text)' }],
      cost: (r) => [{ v: r.cost || 0, color: 'var(--text)' }],
    }[st.metric];
    const key = { requests: [['Successful', 'var(--text)'], ['Failed', 'var(--bad)']], tokens: [['Input', 'var(--text-2)'], ['Output', 'var(--text)']], cost: [['Estimated cost (USD)', 'var(--text)']] }[st.metric];
    legend.replaceChildren(...key.map(([n, col]) => el('span', {}, Object.assign(el('i'), { style: `background:${col}` }), n)));
    const totals = days.map((k) => series(byDay.get(k) || {}).reduce((a, x) => a + x.v, 0));
    const max = Math.max(...totals, st.metric === 'cost' ? 0.0001 : 4);
    const fmtY = (v) => (st.metric === 'cost' ? usd(v) : compact(v));
    const n = (tag, attrs, ...kids) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); kids.forEach((x) => e.append(x)); return e; };
    const svg = n('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Usage per day' });
    const ph = H - B - T, bw = (W - L) / days.length;
    const grid = n('g', { class: 'grid' });
    for (let i = 0; i <= 4; i++) {
      const y = T + ph - (ph * i) / 4;
      grid.append(n('line', { x1: L, x2: W, y1: y, y2: y }), Object.assign(n('text', { x: L - 6, y: y + 3, 'text-anchor': 'end' }), { textContent: fmtY((max * i) / 4) }));
    }
    svg.append(grid);
    const step = Math.ceil(days.length / 8);
    days.forEach((k, i) => {
      const r = byDay.get(k) || {};
      let y = T + ph;
      const g = n('g', {});
      g.append(n('title', {}, document.createTextNode(`${k}: ${st.metric === 'cost' ? usd(totals[i]) : totals[i].toLocaleString()} ${st.metric === 'requests' ? 'requests' : st.metric === 'tokens' ? 'tokens' : ''}`.trim())));
      for (const part of series(r)) {
        const h = (part.v / max) * ph;
        if (h <= 0) continue;
        y -= h;
        g.append(n('rect', { x: L + i * bw + bw * 0.15, y, width: Math.max(1, bw * 0.7), height: h, rx: 2, fill: part.color, opacity: 0.9 }));
      }
      g.append(n('rect', { x: L + i * bw, y: T, width: bw, height: ph, fill: 'transparent' }));
      svg.append(g);
      if (i % step === 0 && (days.length - 1 - i >= step / 2 || i === days.length - 1)) svg.append(Object.assign(n('text', { x: L + i * bw + bw / 2, y: H - 6, 'text-anchor': 'middle' }), { textContent: new Date(`${k}T12:00:00`).toLocaleDateString([], { month: 'short', day: 'numeric' }) }));
    });
    chartEl.replaceChildren(svg);
  }
  return { root, load, exportCsv, refreshBusinesses };
}

function makePassword() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no look-alike characters
  const bytes = crypto.getRandomValues(new Uint32Array(14));
  return [...bytes].map((n) => chars[n % chars.length]).join('');
}
async function copyText(text, btn) {
  const label = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; toast('Copied to clipboard'); } catch { btn.textContent = 'Copy failed'; toastErr('Could not copy'); }
  setTimeout(() => { btn.textContent = label; }, 1600);
}

async function showBusinessAccess(created) {

    const copy = el('button', { type: 'button', textContent: 'Copy' }); copy.onclick = () => copyText(text, copy);
    credsBox = el('div', { className: 'creds' },

    move.disabled = true; moveMsg.textContent = '';
    try { await api(`/sessions/${encodeURIComponent(id)}/access`, { method: 'PUT', body: JSON.stringify({ userId: pick.value }) }); lastJson = ''; refresh(); toast(`"${id}" moved to ${who}`); showBusinessAccess(); }
    catch (err) { moveMsg.textContent = ''; toastErr(err.message); move.disabled = false; }

  box.replaceChildren(el('div', { className: 'accbox' },
    sec('Owner', ownerCard),

// The business page's API tab: keys and webhooks for other systems.
const EVENT_TEXT = {
  'message.received': 'Message received', 'message.sent': 'Message sent', 'message.status': 'Delivered / read',
  'order.created': 'Order created', 'order.updated': 'Order updated', 'question.created': 'Question for the manager',
  'session.connected': 'WhatsApp connected', 'session.disconnected': 'WhatsApp disconnected',
};
const usedAgo = (ms) => {
  if (!ms) return 'never used';
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? 'used just now' : m < 60 ? `used ${m} min ago` : m < 1440 ? `used ${Math.round(m / 60)} h ago` : `used ${Math.round(m / 1440)} days ago`;
};
async function showBusinessApi(created) {
  const box = $('#rvApi'), id = rulesFor, base = `/sessions/${encodeURIComponent(id)}`;
  let keys, hooks;
  try { [keys, hooks] = await Promise.all([api(`${base}/api-keys`), api(`${base}/webhooks`)]); }
  catch (err) { box.replaceChildren(el('div', { className: 'msg err', textContent: err.message })); return; }
  if (rulesFor !== id) return;
  const sec = (title, ...kids) => el('div', { className: 'upanel accsec' }, el('div', { className: 'uhead' }, el('h3', { textContent: title })), ...kids);
  const again = (made) => showBusinessApi(made);
  const secretBox = (title, text, note) => {
    const copy = el('button', { type: 'button', textContent: 'Copy' }); copy.onclick = () => copyText(text, copy);
    return el('div', { className: 'creds' }, el('b', { textContent: title }), el('pre', { textContent: text }), el('div', { className: 'row' }, copy), el('small', { textContent: note }));
  };

  // ---- keys ----
  const keyRows = keys.keys.length ? keys.keys.map((k) => {
    const rm = el('button', { type: 'button', className: 'alt danger', textContent: 'Remove' });
    rm.onclick = async () => {
      if (!confirm(`Remove the key "${k.name}"? Systems using it stop working immediately.`)) return;
      try { await api(`${base}/api-keys/${encodeURIComponent(k.id)}`, { method: 'DELETE' }); toast('Key removed'); again(); } catch (err) { toastErr(err.message); }
    };
    return el('div', { className: 'apirow' },
      el('div', { className: 'ci' }, el('b', { textContent: k.name }), el('small', {}, el('code', { textContent: `${k.prefix}…` }), ` · ${k.scopes.join(', ')} · ${usedAgo(k.last_used_at)}`)),
      el('div', { className: 'acts' }, rm));
  }) : [el('div', { className: 'apiempty', textContent: 'No keys yet.' })];
  const kName = el('input', { placeholder: 'What will use it? e.g. CRM', maxLength: 60, autocomplete: 'off' });
  const kScopes = ['read', 'send', 'manage'].map((sc) => el('label', {}, el('input', { type: 'checkbox', value: sc, checked: sc !== 'manage' }), ` ${sc}`));
  const kMsg = el('div', { className: 'msg err' });
  const kGo = el('button', { textContent: 'Create key' });
  const kForm = el('form', { className: 'accform' },
    el('label', {}, 'Name', kName),
    el('div', {}, el('div', { className: 'apiempty', textContent: 'read: see messages, contacts, orders  ·  send: send messages  ·  manage: change orders, auto-replies, webhooks' }), el('div', { className: 'apichecks' }, ...kScopes)),
    kMsg, el('div', { className: 'row' }, kGo));
  kForm.onsubmit = async (e) => {
    e.preventDefault(); kGo.disabled = true; kMsg.textContent = '';
    try {
      const r = await api(`${base}/api-keys`, { method: 'POST', body: JSON.stringify({ name: kName.value, scopes: kScopes.map((l) => l.firstChild).filter((c) => c.checked).map((c) => c.value) }) });
      toast('Key created'); again({ key: r.key, name: r.name });
    } catch (err) { kMsg.textContent = err.message; kGo.disabled = false; }
  };

  // ---- webhooks ----
  const hookRows = hooks.webhooks.length ? hooks.webhooks.map((h) => {
    const test = el('button', { type: 'button', className: 'alt', textContent: 'Test' });
    test.onclick = async () => {
      test.disabled = true; test.textContent = 'Sending…';
      try { const r = await api(`${base}/webhooks/${encodeURIComponent(h.id)}/test`, { method: 'POST' }); r.delivered ? toast(`Test delivered (${r.status})`) : toastErr(`Test failed: ${r.error || r.status}`); }
      catch (err) { toastErr(err.message); }
      test.disabled = false; test.textContent = 'Test';
    };
    const toggle = el('button', { type: 'button', className: 'alt', textContent: h.active ? 'Turn off' : 'Turn on' });
    toggle.onclick = async () => { try { await api(`${base}/webhooks/${encodeURIComponent(h.id)}`, { method: 'PATCH', body: JSON.stringify({ active: !h.active }) }); again(); } catch (err) { toastErr(err.message); } };
    const rm = el('button', { type: 'button', className: 'alt danger', textContent: 'Remove' });
    rm.onclick = async () => {
      if (!confirm(`Remove the webhook ${h.url}?`)) return;
      try { await api(`${base}/webhooks/${encodeURIComponent(h.id)}`, { method: 'DELETE' }); toast('Webhook removed'); again(); } catch (err) { toastErr(err.message); }
    };
    const evs = h.events.includes('*') ? 'All events' : h.events.map((e) => EVENT_TEXT[e] || e).join(', ');
    return el('div', { className: 'apirow' },
      el('div', { className: 'ci' },
        el('b', { textContent: h.url }),
        el('small', {}, el('span', { className: `chip ${h.active ? 'good' : 'bad'}`, textContent: h.active ? 'On' : 'Off: too many failures' }), ` ${evs}${h.failures ? ` · ${h.failures} failed in a row` : ''}`)),
      el('div', { className: 'acts' }, test, toggle, rm));
  }) : [el('div', { className: 'apiempty', textContent: 'No webhooks yet.' })];
  const wUrl = el('input', { type: 'url', placeholder: 'https://your-system.com/whatsapp-events', autocomplete: 'off', maxLength: 500 });
  const wAll = el('input', { type: 'checkbox', checked: true });

  const wList = el('div', { className: 'apichecks', hidden: true }, ...wEvents);

  const wMsg = el('div', { className: 'msg err' });
  const wGo = el('button', { textContent: 'Add webhook' });
  const wForm = el('form', { className: 'accform' },

    el('div', {}, el('div', { className: 'apichecks' }, el('label', {}, wAll, ' All events')), wList),
    wMsg, el('div', { className: 'row' }, wGo));
  wForm.onsubmit = async (e) => {
    e.preventDefault(); wGo.disabled = true; wMsg.textContent = '';
    try {
      const events = wAll.checked ? ['*'] : wEvents.map((l) => l.firstChild).filter((c) => c.checked).map((c) => c.value);
      const r = await api(`${base}/webhooks`, { method: 'POST', body: JSON.stringify({ url: wUrl.value.trim(), events }) });
      toast('Webhook added'); again({ secret: r.secret, url: r.url });
    } catch (err) { wMsg.textContent = err.message; wGo.disabled = false; }
  };

  // ---- how to call it ----
  const origin = location.origin;
  const curl = `curl ${origin}/v1/messages \\\n  -H "Authorization: Bearer YOUR_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '{"to":"923001234567","type":"text","text":"Hello!"}'`;
  const curlCopy = el('button', { type: 'button', className: 'alt', textContent: 'Copy' }); curlCopy.onclick = () => copyText(curl, curlCopy);
  const baseCopy = el('button', { type: 'button', className: 'alt', textContent: 'Copy' }); baseCopy.onclick = () => copyText(`${origin}/v1`, baseCopy);

  box.replaceChildren(el('div', { className: 'apibox' },
    ...(created?.key ? [secretBox(`Key "${created.name}" created. Copy it now:`, created.key, 'It is shown only once. Keep it private: anyone with it can use this business\'s WhatsApp.')] : []),
    ...(created?.secret ? [secretBox('Webhook added. Its signing secret:', created.secret, 'Shown only once. Your system uses it to check that events really come from here.')] : []),
    sec('API keys', ...keyRows, kForm),
    sec('Webhooks', ...hookRows, wForm),
    sec('Use it', el('div', { className: 'row' }, el('code', { textContent: `${origin}/v1` }), baseCopy), el('pre', { textContent: curl }), el('div', { className: 'row' }, curlCopy))));
}
